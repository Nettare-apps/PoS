<meta charset="utf-8">
<!-- 2026-10-27 fixes (production handoff repo): charset declared (plain-HTTP serving rendered
     every non-ASCII glyph as mojibake); allergies no longer dropped on the join-tables path;
     discarding pending items cancels their orphaned approval requests; happy-hour basePrice only
     set when HH touches the line, and Repeat no longer copies hhAsked; oz->mL toggle converts at
     0.1 mL instead of whole mL; library events no longer carry a stale tab id; queue-approved
     removals now carry per-line off amounts and the close-out attributes them to the requester,
     with net sales following the tab's server. Behavior is otherwise version 39. -->
<title>Pour Register</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: register-style two panes. Left: product > size path (the bartender's buttons). Right: open ticket, ticket cost, bottle depletion. Second view: product library editor. */
:root{
  --bg:#EDF0EC; --surface:#FFFFFF; --sunk:#E2E7E2; --fg:#161F1A; --muted:#58665D; --line:#CBD3CC;
  --accent:#9C540C; --accent-ink:#FFFFFF; --accent-soft:#F5E6D2; --green:#2E5B45; --green-soft:#DCE9E1; --warn:#A23A1C; --s-orange:#D9781C; --s-blue:#2F66C8; --s-red:#C2362B; --s-grey:#8C948F; --s-ink:#FFFFFF;
  --f-btn:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1411; --surface:#171E1A; --sunk:#121814; --fg:#E6ECE7; --muted:#92A097; --line:#29332D;
  --accent:#E29A40; --accent-ink:#1A1105; --accent-soft:#3A2913; --green:#7FBF9C; --green-soft:#1D3127; --warn:#F08A66; --s-orange:#E8923D; --s-blue:#5B8FE6; --s-red:#E5604F; --s-grey:#6E7771; --s-ink:#0F1411; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1411; --surface:#171E1A; --sunk:#121814; --fg:#E6ECE7; --muted:#92A097; --line:#29332D;
  --accent:#E29A40; --accent-ink:#1A1105; --accent-soft:#3A2913; --green:#7FBF9C; --green-soft:#1D3127; --warn:#F08A66; --s-orange:#E8923D; --s-blue:#5B8FE6; --s-red:#E5604F; --s-grey:#6E7771; --s-ink:#0F1411; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px;container:app / inline-size}
/* device preview */
.devbar{max-width:1180px;margin:0 auto 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.devbar .meta{font-size:12px;color:var(--muted)}
.devfit{margin:0 auto;overflow:hidden;border-radius:28px}
.device{transform-origin:top left}
.device.framed{transform:scale(var(--k,1));border:10px solid var(--fg);border-radius:28px;background:var(--bg);overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.device.framed .screen{height:100%;overflow:auto;overscroll-behavior:contain}
.device.framed .wrap{padding:12px}
.device.framed .foot{display:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--f-btn);font-weight:700;font-size:22px;letter-spacing:.01em;margin:0}
.brand span{font-size:12px;color:var(--muted)}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:4px;font-family:var(--f-btn);font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 0 var(--line)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* register */
.reg{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.reg>.side{position:sticky;top:12px;height:calc(var(--apph,100vh) - 24px);align-self:start}
.reg>.side>#ticket{display:flex;flex-direction:column;height:100%;min-height:0}
#ticket .tscroll{flex:1 0 auto;min-height:150px;max-height:none;overflow:auto;overscroll-behavior:contain}
.reg>.side>#ticket{overflow-y:auto;overscroll-behavior:contain}
.reg>.side>#ticket .tscroll{flex:1 1 150px}
#ticket .tfoot{flex:none;border-top:1px solid var(--line);padding-top:4px;margin-top:6px}
#ticket .tfoot .tot{margin-top:6px}
.sheettog{display:none;border:0;background:transparent;font-size:14px;padding:0 8px 0 0;color:var(--muted)}
@container app (max-width:600px){
  .reg{grid-template-columns:minmax(0,1fr);padding-bottom:calc(var(--apph,100vh) * .5)}
  .reg>.side{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:30;height:calc(var(--apph,100vh) * .48);padding:0 max(6px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px,env(safe-area-inset-left,0px))}
  .reg>.side>#ticket{border-radius:14px 14px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:10px 12px}
  .sheettog{display:inline-block}
  .reg.sheetmin{padding-bottom:80px}
  .reg.sheetmin>.side{height:56px}
  .reg.sheetmin #ticket .tscroll,.reg.sheetmin #ticket .tfoot,.reg.sheetmin #ticket .ph>.muted,.reg.sheetmin #ticket .tnote,.reg.sheetmin #ticket #te-open,.reg.sheetmin #ticket .ph+p{display:none}
  #ticket .ph>.muted{flex-basis:100%;margin-top:-2px}
  #ticket .tfoot .tot{grid-template-columns:1fr auto 1fr auto;font-size:12px}
  #ticket .tfoot .tot .big{font-size:16px}
  .sendbar .btn{padding:7px 4px;font-size:13px}
  #ticket .row-btns{margin-top:6px}
}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;min-height:30px}
.crumb button{border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:4px 10px;font-family:var(--f-btn);font-weight:600}
.crumb b{font-family:var(--f-btn);font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:4px 12px;font-family:var(--f-btn);font-weight:600;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pbtn{min-height:84px;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.pbtn:hover{border-color:var(--muted)}
.pbtn .n{font-family:var(--f-btn);font-weight:600;font-size:15px;line-height:1.2}
.pbtn .m{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sbtn{min-height:92px;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.sbtn:hover{border-color:var(--muted)}
.sbtn .n{font-family:var(--f-btn);font-weight:600;font-size:16px}
.sbtn .p{font-family:var(--f-num);font-size:22px;font-weight:600;margin-top:auto}
.sbtn .m{font-size:12px;color:var(--muted)}
.sbtn.custom{background:var(--accent-soft);border-color:var(--accent);border-style:dashed}
.sbtn.custom .p{font-size:15px;font-family:var(--f-btn);color:var(--accent)}
.sbtn[aria-pressed="true"]{border-style:solid;box-shadow:inset 0 0 0 1px var(--accent)}

.inv{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 16px;background:var(--green-soft);border-radius:4px;padding:10px 12px;margin-bottom:12px}
.inv .invv{font-family:var(--f-btn);font-size:20px;font-weight:600;color:var(--green)}
.inv .invv .num{font-size:22px}
.inv-s{font-size:13px;color:var(--muted)}
.inv.out{background:var(--accent-soft)}
.inv.out .invv,.inv.out .inv-s{color:var(--warn)}
.sbtn .n{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cnt{font-family:var(--f-num);font-size:12px;font-weight:500;color:var(--green);white-space:nowrap}
.cnt.out{color:var(--warn)}
/* custom pour */
.pour{margin-top:12px;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:14px;border-top:1px solid var(--line);padding-top:14px}
@container app (max-width:560px){.pour{grid-template-columns:minmax(0,1fr)}}
.readout{display:flex;flex-direction:column;gap:10px;min-width:0}
.entry{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--fg);padding-bottom:4px}
.entry .v{font-family:var(--f-num);font-size:34px;font-weight:600;min-width:1ch}
.entry .u{font-family:var(--f-btn);font-weight:600;color:var(--muted);font-size:16px}
.entry .alt{margin-left:auto;font-size:13px;color:var(--muted)}
.gauge{position:relative;height:30px;border:1px solid var(--line);border-radius:4px;background:var(--sunk);overflow:hidden}
.gauge .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.85;transition:width .15s}
.gauge .hl{position:absolute;top:0;bottom:0;border:2px solid var(--fg);border-radius:2px}
.gauge .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.gscale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--f-num)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{background:var(--sunk);border-radius:4px;padding:8px 10px}
.fact .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.fact .v{font-family:var(--f-num);font-size:18px;font-weight:600}
.note{font-size:12px;color:var(--warn)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keys button{height:46px;border:1px solid var(--line);background:var(--sunk);border-radius:4px;font-family:var(--f-num);font-size:18px;font-weight:500}
.keys .add{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-family:var(--f-btn);font-weight:700;font-size:16px}
.keys .add:disabled{opacity:.4;cursor:not-allowed}

/* ticket */
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.ph h2{font-family:var(--f-btn);font-size:16px;margin:0;font-weight:700}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lines li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.lines .t{font-weight:500;overflow-wrap:anywhere}
.lines .s{font-size:12px;color:var(--muted)}
.lines .pr{font-family:var(--f-num);font-weight:600}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;border-radius:4px}
.x:hover{color:var(--warn);background:var(--sunk)}
.empty{padding:18px 0;color:var(--muted);font-size:13px}
.tot{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin-top:10px;font-size:13px}
.tot .big{font-size:20px;font-weight:600}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:8px 12px;font-family:var(--f-btn);font-weight:600;font-size:14px}
.btn.pri{background:var(--green);color:var(--surface);border-color:var(--green);flex:1}
:root[data-theme="dark"] .btn.pri{color:#0F1411}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#0F1411}}
.btn:disabled{opacity:.45;cursor:not-allowed}
.dep{display:flex;flex-direction:column;gap:10px}
.dep .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}
.dep .n{font-size:13px;font-weight:500;overflow-wrap:anywhere}
.dep .q{font-family:var(--f-num);font-size:12px;color:var(--muted);text-align:right}
.dep .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:flex}
.dep .bar i{display:block;height:100%}
.dep .bar .c{background:var(--green)}
.dep .bar .o{background:var(--accent)}
.legend{display:flex;gap:12px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}

/* publish bar */
.pubbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:14px}
.pstat{display:flex;align-items:center;gap:8px;font-weight:500}
.pstat .dot{width:9px;height:9px;border-radius:50%;background:var(--green)}
.pstat.dirty .dot{background:var(--warn)}
.pstat.draft .dot{background:var(--accent)}
.pacts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn.pub{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:8px 12px;font-size:13px;margin-bottom:14px}
.snap{background:var(--accent-soft);border:1px solid var(--accent);border-radius:4px;padding:10px 12px;font-size:13px}
.keys .add.alt{background:var(--accent-soft);color:var(--fg);border-color:var(--accent);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 12px;font-size:14px}
/* categories + modifier setup */
.chips.sub{margin-top:-4px}
.chips.sub .chip{font-size:12px;padding:3px 10px}
.libtabs{margin-bottom:14px}
.rb{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:1px 7px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.rb.required{background:var(--warn);color:var(--surface)}
.rb.force{background:var(--accent-soft);color:var(--accent)}
.mother{border-top:1px solid var(--line);padding-top:10px}
.mother summary{cursor:pointer;font-family:var(--f-btn);font-weight:600;color:var(--muted)}
#mdone:disabled{opacity:.6;cursor:not-allowed}
.backbar{margin:-4px 0 4px}
.mchip.share{border-style:dashed}
.lmods .seatl{color:var(--green);font-weight:600}
.qtybar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:-4px 0 12px}
.qstep{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:4px;background:var(--sunk)}
.qstep button{border:0;background:transparent;width:36px;height:34px;font-size:18px}
.qstep button:disabled,.lstep button:disabled{opacity:.35;cursor:default}
.qstep .num{min-width:28px;text-align:center;font-weight:600}
.qchip{border:1px solid var(--line);background:transparent;border-radius:4px;padding:5px 10px;font-family:var(--f-num);font-size:13px}
.qchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qnote{font-size:12px}
.lines li{grid-template-columns:minmax(0,1fr) auto auto auto}
.lstep{display:inline-flex;align-items:center;gap:2px}
.lstep button{width:26px;height:26px;border:1px solid var(--line);background:var(--sunk);border-radius:4px;font-size:14px;line-height:1;padding:0}
.lstep .num{min-width:18px;text-align:center;font-size:13px}
.lqn{font-family:var(--f-num);color:var(--accent);font-weight:600}
.stb{display:inline-block;font-family:var(--f-body);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:99px;vertical-align:1px}
.stb.new{background:var(--sunk);color:var(--muted)}
.stb.held{background:var(--accent-soft);color:var(--accent)}
.stb.fired{background:var(--green-soft);color:var(--green)}
.lmods .crs{color:var(--accent);font-weight:600}
.sendbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.sendbar .btn{padding:9px 6px}
.firebar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.firebar .num{font-size:11px;opacity:.75}
.cpick{display:flex;flex-direction:column;gap:6px}
.cpick .tag{justify-content:space-between}
.clist{display:flex;flex-direction:column;gap:6px;max-width:360px}
.crow{display:grid;grid-template-columns:20px 1fr auto auto;gap:6px;align-items:center}
.crow input{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;padding:7px 0}
.inh{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.psel{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:3px 6px;font-size:12px;max-width:150px}
#g-items input,#g-items select,#g-menus select,#own-mods select{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
/* compact nav + home */
.topnav{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.topnav .seg button{padding:6px 12px}
.navwho{font-family:var(--f-btn);font-weight:600;color:var(--muted);font-size:13px}
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px;align-items:start}
.hcard{display:flex;flex-direction:column;gap:4px}
.hname{font-family:var(--f-btn);font-size:28px;font-weight:700;line-height:1.1}
.htiles{display:grid;gap:8px;margin-top:8px}
.htile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:var(--r);padding:12px 14px}
.htile:hover{border-color:var(--muted)}
.htile .ht{font-family:var(--f-btn);font-weight:700;font-size:17px}
.htile .hm{font-size:12px;color:var(--muted)}
.hstaff{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.hstaff li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.hnote p{font-size:12px;color:var(--muted);margin:6px 0 0;max-width:70ch}
.crumb.mtop #mdone{order:3;margin-left:auto;min-width:96px}
[data-view="floor"] .topnav,[data-view="register"] .topnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:8px;margin-block:-8px 0}
.crumb.mtop{position:sticky;top:0;z-index:6;background:var(--surface);margin:-14px -14px 12px;padding:12px 14px;border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0}
.reg>#smodal{display:contents}
/* nav pinned on the register: ticket and modifier header sit below it */
[data-view="register"] .crumb.mtop{top:var(--navh,46px)}
@container app (min-width:601px){
  [data-view="register"] .reg>.side{top:calc(var(--navh,46px) + 6px);height:calc(var(--apph,100vh) - var(--navh,46px) - 18px)}
}
/* library: list pinned with its own scroll, editor scrolls with the page */
.lib>.libnav{position:sticky;top:12px;align-self:start;height:calc(var(--apph,100vh) - 24px);min-height:0;overflow:hidden}
.lib>.libnav>.libtools{flex:none;max-height:45%;overflow:auto;overscroll-behavior:contain}
.lib>.libnav>.plist{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain}
@container app (max-width:820px){
  .lib>.libnav{position:static;height:auto;overflow:visible}
  .lib>.libnav>.libtools{max-height:none;overflow:visible}
  .lib>.libnav>.plist{flex:none;max-height:calc(var(--apph,100vh) * .4)}
}
/* remove: discount / comp / void */
.navr{display:flex;align-items:center;gap:10px}

.fs{display:flex;flex-direction:column;gap:10px}
.fs h3{margin:0;font-family:var(--f-btn);font-size:15px;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:6px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f input,.f select,.tbl input,.tbl select{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:7px 9px}
.f input[type=number],.tbl input{font-family:var(--f-num)}
.f .h{font-size:11px;color:var(--muted)}
.basis{display:flex;flex-wrap:wrap;gap:6px}
.basis label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:4px;padding:6px 10px;background:var(--sunk);font-size:13px}
.basis label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:680px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.num,.tbl th.num{text-align:right}
.tbl tr.cur td{background:var(--accent-soft)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--green-soft);color:var(--green)}
.pill.ov{background:var(--accent-soft);color:var(--accent)}
.lib-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.warnbox{font-size:12px;color:var(--warn)}
.foot{font-size:12px;color:var(--muted);max-width:70ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- pricing engine ---------- */
function servingMl(s){ return s.unit==='oz' ? s.qty*OZ : s.qty; }
function basisCost(p){ const v=p.cost[p.basis]; return (v && v>0) ? v : null; }
function perMl(p){ const c=basisCost(p); return c ? c/p.size : null; }
/* theoretical cost runs on the lowest cost on file: that is what was actually paid */
function lowPerMl(p){ const v=['frontline','net','sale'].map(b=>perMlFor(p,b)).filter(Boolean); return v.length ? Math.min(...v) : null; }
function perMlFor(p, basis){ const v=p.cost[basis]; return (v && v>0) ? v/p.size : null; }
function priceAt(p, ml, pct){ const r=perMl(p); return (r && pct>0) ? Math.round(r*ml/(pct/100)) : null; }
function bucket(p, ml){
  const step = p.size/10;
  const b = Math.min(10, Math.max(1, Math.ceil(ml/step - 1e-9)));
  const pct = p.scale.min + (p.scale.max - p.scale.min)*(b-1)/9;
  return {b, pct, lo:(b-1)*step, hi:b*step};
}
function stdPrice(p, s){
  const ml = servingMl(s), basis = s.basis || p.basis, r = perMlFor(p, basis);
  const over = s.override!=null && s.override!=='' && s.override>0;
  const price = over ? Math.round(s.override) : ((r && s.target>0) ? Math.round(r*ml/(s.target/100)) : null);
  const actual = (price && r) ? r*ml/price*100 : null;
  const lo=lowPerMl(p);
  return {ml, price, actual, over, basis, cost: lo ? lo*ml : null};
}
const basisName = b => b==='frontline' ? 'Frontline' : b==='net' ? 'Net' : 'Sale';
/* custom pours can be typed in oz or mL each ring; defaults to the library unit and resets after every ring-in */
const ringUnit = () => S.ringUnit || S.unit;
function customQuote(p, val){
  const ml = ringUnit()==='oz' ? val*OZ : val;
  const bk = bucket(p, ml);
  const price = priceAt(p, ml, bk.pct);
  const r = perMl(p);
  const lo=lowPerMl(p);
  return {ml, ...bk, price, cost: lo? lo*ml : null, pricedCost: r? r*ml : null, actual: (price&&r)? r*ml/price*100 : null};
}
const fmtVol = ml => S.unit==='oz' ? (ml/OZ).toFixed(ml/OZ<10?2:1).replace(/\.?0+$/,'')+' oz' : Math.round(ml)+' mL';
const fmtAlt = ml => S.unit==='oz' ? Math.round(ml)+' mL' : (ml/OZ).toFixed(2).replace(/\.?0+$/,'')+' oz';
const allLines = () => [...S.quick, ...S.tabs.flatMap(t=>t.lines)];
const isItem = p => p && p.kind==='item';
const openMl = p => allLines().filter(l=>!notMade(l)).reduce((a,l)=> a + ((l.pid===p.id ? (l.ml||0) : 0) + (l.deplete||[]).filter(d=>d.pid===p.id).reduce((x,d)=>x+d.ml,0)) * (l.qty||1) * partOf(l), 0);
function itemCost(p){ return (p.recipe||[]).reduce((a,r)=>{ const q=lprod(r.pid); const pm=q?lowPerMl(q):null; return a+(pm?pm*r.ml:0); },0); }
function addItem(p){ addLine({pid:p.id, label:p.section||'', ml:0, price:p.price, cost:itemCost(p), kind:'item', deplete:(p.recipe||[]).map(x=>({pid:x.pid, ml:x.ml}))}); if(S.modLine!=null) renderLeft(); }
const remainingMl = p => invOf(p.id)*p.size - openMl(p);
const fmtTotal = ml => S.unit==='oz' ? Math.round(ml/OZ).toLocaleString()+' oz' : Math.round(ml).toLocaleString()+' mL';
const fmtBtl = b => (Math.round(b*100)/100).toLocaleString(undefined,{maximumFractionDigits:2});
const servLabel = s => s.label ? s.label : (s.qty+' '+(s.unit==='oz'?'oz':'mL'));

function renderPour(p){
  const val = parseFloat(S.entry)||0;
  const q = customQuote(p, val);
  const ticks = Array.from({length:9},(_,i)=>`<i class="tick" style="left:${(i+1)*10}%"></i>`).join('');
  const fillPct = Math.min(100, q.ml/p.size*100);
  const m = val ? stdMatches(p, q.ml) : [];
  const factsHtml = m.length===1
    ? `<div class="snap"><b>Matches the ${esc(servLabel(m[0].s))} button.</b> Standard price ${money(m[0].q.price)} (${pctf(m[0].q.actual)} cost) replaces the sliding scale.</div>`
    : m.length>1
    ? `<div class="snap"><b>${m.length} standard pours match this volume.</b> Choose which one to ring in.</div>`
    : `<div class="facts">
        <div class="fact"><div class="k">Bucket</div><div class="v num">${val?q.b+' / 10':'—'}</div></div>
        <div class="fact"><div class="k">Cost target</div><div class="v num">${val?pctf(q.pct):'—'}</div></div>
        <div class="fact"><div class="k">Price</div><div class="v num">${val&&q.price?money(q.price):'—'}</div></div>
      </div>
      <div class="muted" style="font-size:12px">${val?`Bucket ${q.b} covers ${Math.round(q.lo)}–${Math.round(q.hi)} mL. Pour cost ${q.pricedCost?money2(q.pricedCost):'—'}, actual ${q.actual?pctf(q.actual):'—'} after rounding.`:'Type an amount. Any value works; the bucket changes every '+Math.round(p.size/10)+' mL.'}</div>`;
  const addHtml = m.length===1

function stdMatches(p, ml){
  return p.servings.map((s,i)=>({s,i,q:stdPrice(p,s)})).filter(x=>x.q.price && Math.abs(x.q.ml-ml) <= Math.max(1, x.q.ml*0.005));
}
function addStd(p, i){
  const s=p.servings[i], q=stdPrice(p,s); if(!q.price) return;
  addLine({pid:p.id,label:servLabel(s),ml:q.ml,price:q.price,cost:q.cost,kind:'std'});
  S.sel=null; S.custom=false; S.entry=''; renderLeft();
}
function keyIn(k){
  if(k==='⌫') S.entry=S.entry.slice(0,-1);
  else if(k==='.'){ if(!S.entry.includes('.')) S.entry=(S.entry||'0')+'.'; }
  else if(S.entry.length<7){ if(S.entry==='0') S.entry=k; else S.entry+=k; }
  renderPour(lprod(S.sel));
}
function addCustom(){
  const p=lprod(S.sel); const val=parseFloat(S.entry)||0; if(!val) return;
  const q=customQuote(p,val);
  const m=stdMatches(p, q.ml);
  if(m.length===1) return addStd(p, m[0].i);
  if(m.length>1) return; /* the bartender picks one of the matching buttons */
  if(!q.price) return;
  addLine({pid:p.id,label:'Custom '+fmtVol(q.ml)+' · bucket '+q.b,ml:q.ml,price:q.price,cost:q.cost,kind:'custom',entryUnit:ringUnit(),entry:val});
  S.sel=null;S.custom=false;S.entry='';renderLeft();
}
document.addEventListener('keydown',e=>{
  if(S.view!=='register'||!S.custom||!S.sel) return;
  if(e.target.matches('input,select,textarea')) return;
  if(/^[0-9.]$/.test(e.key)) keyIn(e.key);
  else if(e.key==='Backspace'){e.preventDefault();keyIn('⌫');}
  else if(e.key==='Enter') addCustom();
});

/* ---------- remove: discount, comp, void (with manager approval queue) ---------- */
const PERMS = { Staff:{discount:false, comp:false, void:false}, Manager:{discount:true, comp:true, void:true} };

  comp:{name:'Comp', past:'Comped', desc:'Item stays on the check at $0. Product still comes out of inventory.'},

S.requests = []; S.rm = null; S.apprOpen = false;
const lid = l => l.id || (l.id = 'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));

const adjOff = (a, gross) => a.kind==='discount' ? Math.min(gross, a.pct ? gross*a.pct/100 : (a.amt||0)) : gross;

    if(k==='delete'){ const ls=rmLines(); logEv('remove_unsent',{lines:ls.map(l=>({pid:l.pid, line:l.label, qty:qtyOf(l), total:lineGross(l)}))}); S.ticket=S.ticket.filter(l=>!ls.includes(l)); S.modLine=null; closeRemove(); renderTicket(); renderLeft(); return; }
    r.kind=k; r.step='reason'; r.reason=null; r.err=''; renderRemove(); });

  const amt=$('#rm-amt'), pin=$('#rm-pctin');

function rmPin(k){
  const r=S.rm; if(!r) return;
  if(k==='⌫') r.pin=r.pin.slice(0,-1); else if(r.pin.length<4) r.pin+=k;
  if(r.pin.length===4){
    const u=staffBy(r.pin);

    logEv('remove_code_fail',{kind:r.kind, codeUser:u?u.pin:null});
    r.pin=''; r.err = u ? `${u.name} can't approve a ${ADJ_KINDS[r.kind].name.toLowerCase()}.` : "That code doesn't match a manager.";
  } else r.err='';

function adjFromRm(r){ return {kind:r.kind, reason:r.reason, note:r.note||'', pct:r.kind==='discount'?(r.pct||null):null, amt:r.kind==='discount'&&!r.pct?Math.round((parseFloat(r.amt)||0)*100)/100:null, made:r.kind!=='void', by:S.user, at:new Date().toISOString()}; }
function applyRemove(approver, how){
  if(S.rm && S.rm.scope==='check') return applyChk(approver, how);
  const r=S.rm; const ls=rmLines(); const now=new Date().toISOString();
  const unsentVoid = r.kind==='void' ? ls.filter(l=>!isSent(l)) : [];
  ls.filter(l=>!unsentVoid.includes(l)).forEach(l=>{ l.adj={...adjFromRm(r), state:'applied', approvedBy:approver, approvedAt:now}; delete l.adjDenied; });
  if(unsentVoid.length) S.ticket=S.ticket.filter(l=>!unsentVoid.includes(l));
  logEv('adjust_'+r.kind,{how, approvedBy:approver, reason:r.reason, note:r.note||null, pct:r.pct||null, amt:r.kind==='discount'&&!r.pct?parseFloat(r.amt)||0:null, 
    lines:ls.map(l=>({pid:l.pid, line:l.label, qty:qtyOf(l), gross:lineGross(l), off:unsentVoid.includes(l)?lineGross(l):adjOff(l.adj,lineGross(l)), sent:isSent(l)}))});
  S.modLine=null; closeRemove(); renderTicket(); renderLeft(); renderApprBtn();
}
function requestRemove(){
  if(S.rm && S.rm.scope==='check') return requestChk();
  const r=S.rm; const ls=rmLines(); const id='r'+Date.now().toString(36);
  const req={id, tabId:S.activeTab||null, lineIds:ls.map(lid), ...adjFromRm(r)};
  S.requests.push(req);
  ls.forEach(l=>{ l.adj={...adjFromRm(r), state:'pending', reqId:id}; delete l.adjDenied; });
  logEv('adjust_request',{req:id, kind:r.kind, reason:r.reason, note:r.note||null, lines:ls.map(l=>({pid:l.pid, line:l.label, qty:qtyOf(l), gross:lineGross(l)}))});
  S.modLine=null; closeRemove(); renderTicket(); renderApprBtn();
}
function cancelRequest(reqId){
  const q=S.requests.find(x=>x.id===reqId); if(!q) return;
  q.lineIds.forEach(id=>{ const f=findLine(id); if(f && f.l.adj && f.l.adj.reqId===reqId) delete f.l.adj; });
  if(q.scope==='check'){ const h=hostOf(q.tabId), c=h&&(h.checks||[]).find(x=>x.id===q.chkId); if(c&&c.adj&&c.adj.reqId===reqId) delete c.adj; }
  S.requests=S.requests.filter(x=>x.id!==reqId);
  logEv('adjust_request_cancel',{req:reqId, kind:q.kind, tab:q.tabId});
}
function decideRequest(reqId, approve){
  const q=S.requests.find(x=>x.id===reqId); if(!q) return;
  const now=new Date().toISOString(), lines=q.lineIds.map(findLine).filter(Boolean);
  if(q.scope==='check'){ const h=hostOf(q.tabId), c=h&&(h.checks||[]).find(x=>x.id===q.chkId);
    if(c){ if(approve) c.adj={...c.adj, state:'applied', approvedBy:S.user, approvedAt:now}; else { delete c.adj; c.adjDenied={kind:q.kind, by:S.user, at:now}; } }
    S.requests=S.requests.filter(x=>x.id!==reqId);
    logEv(approve?'check_approve':'check_deny',{req:reqId, kind:q.kind, reason:q.reason, requestedBy:q.by, waitedSec:Math.round((Date.parse(now)-Date.parse(q.at))/1000), tab:q.tabId, check:c?c.label:null, off:c&&approve?+checkCalc(h,c).off.toFixed(2):null});
    return; }
  const detail=[];
  lines.forEach(({l, tab})=>{
    const gross=lineGross(l);
    if(approve){
      if(q.kind==='void' && !isSent(l)){ if(tab) tab.lines=tab.lines.filter(x=>x!==l); else S.quick=S.quick.filter(x=>x!==l); detail.push({pid:l.pid, line:l.label, qty:qtyOf(l), gross, off:gross}); return; }
      l.adj={...l.adj, state:'applied', approvedBy:S.user, approvedAt:now};
      detail.push({pid:l.pid, line:l.label, qty:qtyOf(l), gross, off:adjOff(l.adj, gross)});
    } else { delete l.adj; l.adjDenied={kind:q.kind, by:S.user, at:now}; detail.push({pid:l.pid, line:l.label, qty:qtyOf(l), gross, off:0}); }
  });
  S.requests=S.requests.filter(x=>x.id!==reqId);
  logEv(approve?'adjust_approve':'adjust_deny',{req:reqId, kind:q.kind, reason:q.reason, requestedBy:q.by, waitedSec:Math.round((Date.parse(now)-Date.parse(q.at))/1000), tab:q.tabId,
    lines:detail});
}

/* ---------- checks: every tab holds one or more checks; lines belong to one ---------- */
const partOf = l => l.part||1;
const partText = p => { const n=Math.round(1/p); return Math.abs(1/n-p)<1e-6 ? '1/'+n : (Math.round(p*100))+'%'; };
S.quickHost = {checks:null, cur:null};
const newCid = () => 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function hostOf(tabId){ return tabId ? S.tabs.find(t=>t.id===tabId) : S.quickHost; }
function curHost(){ return tabById(S.activeTab) || S.quickHost; }
function hostLines(h){ return h===S.quickHost ? S.quick : h.lines; }
function setHostLines(h, ls){ if(h===S.quickHost) S.quick=ls; else h.lines=ls; }
function relabelChecks(h){ let k=0; h.checks.forEach(c=>{ c.label = c.origin ? c.origin : typeof c.seat==='number' ? 'Seat '+c.seat : c.seat==='none' ? 'No seat' : 'Check '+(++k); }); }
function ensureChecks(h){ if(!h.checks || !h.checks.length){ h.checks=[{id:newCid(), seat:null, label:'Check 1', adj:null}]; } if(!h.checks.some(c=>c.id===h.cur)) h.cur=h.checks[0].id; return h.checks; }
function chkById(h, id){ ensureChecks(h); return h.checks.find(c=>c.id===id) || h.checks[0]; }
function lineChk(l, h){ ensureChecks(h); return h.checks.some(c=>c.id===l.chk) ? l.chk : h.checks[0].id; }
function chkLines(h, id){ return hostLines(h).filter(l=>lineChk(l,h)===id); }
function checkCalc(h, c){
  const ls=chkLines(h,c.id), sub=ls.reduce((a,l)=>a+lineTotal(l),0);
  const elig=ls.filter(l=>!adjApplied(l)).reduce((a,l)=>a+lineTotal(l),0);
  const a = c.adj && c.adj.state==='applied' ? c.adj : null;
  const off = !a ? 0 : a.kind==='comp' ? sub : Math.min(elig, a.pct ? elig*a.pct/100 : (a.amt||0));
  return {ls, sub, elig, off, total:sub-off, adj:a};
}
/* who pays for what: an item's own discount keeps its reason; a check comp covers the remainder under its reason */
function checkAttribution(cc){
  return cc.ls.map(l=>{ const g=lineGross(l), own=adjApplied(l), rem=lineTotal(l); let off=0;
    if(cc.adj){ if(cc.adj.kind==='comp') off=rem; else if(!own && cc.elig>0) off=cc.off*rem/cc.elig; }
    return {pid:l.pid, line:l.label, gross:+g.toFixed(2), own:own?{kind:own.kind, reason:own.reason, off:+(g-rem).toFixed(2)}:null, check:off?{kind:cc.adj.kind, reason:cc.adj.reason, off:+off.toFixed(2)}:null}; });
}
function closeCheck(h, c){
  const tab = h===S.quickHost ? null : h, note=t=>{ const n=$('#close-note'); if(n) n.textContent=t; };
  const ls=chkLines(h,c.id), np=ls.filter(adjPending).length + (c.adj&&c.adj.state==='pending'?1:0);
  if(np){ note(`${np} removal${np===1?' is':'s are'} waiting on a manager. Approve or cancel ${np===1?'it':'them'} before closing.`); logEv('close_blocked_pending',{pending:np, check:c.label}); return; }
  const bl=ls.find(l=>unmetFor(l).length); if(bl){ S.modLine=S.ticket.indexOf(bl); S.sel=null; S.custom=false; renderLeft(); renderTicket(); note('Finish the required modifiers before closing.'); return; }
  const last = h.checks.length===1, cc=checkCalc(h,c);
  logEv(!last ? 'close_check' : tab ? 'close_tab' : 'close_ticket', {check:c.label, checks:h.checks.length, lines:ls.length, sub:+cc.sub.toFixed(2), off:+cc.off.toFixed(2), total:+cc.total.toFixed(2), server:tab?tab.server:S.user, guests:tab?tab.guests:null, area:tab?tab.area:null, attribution:checkAttribution(cc)});
  S.modLine=null;
  ls.filter(l=>!notMade(l)).forEach(l=>{ const n=qtyOf(l)*partOf(l), p=lprod(l.pid); if(p&&!isItem(p)) S.inv[p.id]=invOf(p.id)-n*l.ml/p.size; (l.deplete||[]).forEach(d=>{ const q=lprod(d.pid); if(q) S.inv[q.id]=invOf(q.id)-n*d.ml/q.size; }); });
  saveInv();
  if(last){
    if(tab){ S.tabs=S.tabs.filter(t=>t.id!==tab.id); S.transfers.forEach(x=>x.tabIds=x.tabIds.filter(id=>id!==tab.id)); S.transfers=S.transfers.filter(x=>x.tabIds.length); S.activeTab=null; S.view='floor'; render(); }
    else { S.quick=[]; S.quickHost={checks:null, cur:null}; renderTicket(); renderLeft(); }
    return;
  }
  setHostLines(h, hostLines(h).filter(l=>!ls.includes(l)));

}
function goCheck(h, dir){ const i=h.checks.findIndex(c=>c.id===h.cur), j=i+dir; if(j<0||j>=h.checks.length) return; h.cur=h.checks[j].id; S.modLine=null; logEv('check_switch',{to:h.checks[j].label, how:'swipe'}); renderTicket(); renderLeft(); }
function bindChecks(h, ts){
  const el=$('#ticket'), note=t=>{ const n=$('#chk-note'); if(n) n.textContent=t; };
  el.querySelectorAll('[data-chk]').forEach(b=>b.onclick=()=>{ h.cur=b.dataset.chk; S.modLine=null; logEv('check_switch',{to:chkById(h,h.cur).label, how:'tap'}); renderTicket(); renderLeft(); });
  const spu=el.querySelector('[data-chksplitui]'); if(spu) spu.onclick=openSplit;
  const add=el.querySelector('[data-chkadd]'); if(add) add.onclick=()=>{ const c={id:newCid(), seat:null, label:'', adj:null}; h.checks.push(c); relabelChecks(h); h.cur=c.id; logEv('check_add',{checks:h.checks.length}); renderTicket(); };
  const sp=el.querySelector('[data-chksplit]'); if(sp) sp.onclick=()=>{ const err=splitBySeat(h); if(err) return note(err); S.modLine=null; renderTicket(); renderLeft(); };
  const cb=el.querySelector('[data-chkcomb]'); if(cb) cb.onclick=()=>{

    const keep=h.checks[0]; hostLines(h).forEach(l=>l.chk=keep.id); keep.seat=null; delete keep.origin; h.checks=[keep]; relabelChecks(h); h.cur=keep.id; logEv('check_combine',{}); renderTicket(); };

    ts.addEventListener('pointerdown',e=>{ sx=e.clientX; sy=e.clientY; swiped=false; });
    ts.addEventListener('pointerup',e=>{ if(sx==null) return; const dx=e.clientX-sx, dy=e.clientY-sy; sx=null; if(Math.abs(dx)>60 && Math.abs(dy)<40){ swiped=true; goCheck(h, dx<0?1:-1); } });

/* move an item between checks from its modifier screen */
function checkMoveHtml(l){

  return `<div class="mvchk"><span class="lbl">Check</span>${h.checks.map(c=>`<button data-mvchk="${c.id}" aria-pressed="${lineChk(l,h)===c.id}">${esc(c.label)}</button>`).join('')}</div>`;
}
document.addEventListener('click',e=>{ const b=e.target.closest('[data-mvchk]'); if(!b) return; const l=S.ticket[S.modLine]; if(!l) return; const h=curHost(), from=chkById(h,lineChk(l,h)).label;
  l.chk=b.dataset.mvchk; h.cur=l.chk; logEv('check_move_item',{pid:l.pid, line:l.label, from, to:chkById(h,l.chk).label}); renderLeft(); renderTicket(); });
function cloneLine(l){ const c=JSON.parse(JSON.stringify(l)); delete c.id; lid(c); c.splitOf=l.id; return c; }
function splitBySeat(h){
  const ls=hostLines(h);
  if(ls.some(adjPending) || h.checks.some(c=>c.adj)) return 'Resolve pending removals and check discounts before splitting.';
  const nums=[...new Set(ls.flatMap(l=>(l.seats||[]).filter(s=>s!=='share')))].sort((a,b)=>a-b);
  if(!nums.length) return 'No items have seats yet. Add seats in each item’s modifiers first.';
  const checks=nums.map(n=>({id:newCid(), seat:n, label:'', adj:null})), byS=Object.fromEntries(checks.map(c=>[c.seat,c.id]));
  let none=null; const out=[];
  ls.forEach(l=>{
    const share=(l.seats||[]).includes('share'), seats= share ? nums : (l.seats||[]).filter(s=>s!=='share');
    if(!seats.length){ if(!none) none={id:newCid(), seat:'none', label:'', adj:null}; l.chk=none.id; out.push(l); return; }
    if(seats.length===1){ l.chk=byS[seats[0]]; out.push(l); return; }
    const n=seats.length;
    if(!share && qtyOf(l)===n){ seats.forEach(s=>{ const c=cloneLine(l); c.qty=1; c.seats=[s]; c.chk=byS[s]; if(c.adj&&c.adj.amt) c.adj.amt=c.adj.amt/n; out.push(c); }); return; }
    seats.forEach(s=>{ const c=cloneLine(l); c.part=partOf(l)/n; c.chk=byS[s]; if(c.adj&&c.adj.amt) c.adj.amt=c.adj.amt/n; out.push(c); });
  });
  h.checks=[...checks, ...(none?[none]:[])]; relabelChecks(h); h.cur=h.checks[0].id; setHostLines(h, out);
  logEv('split_by_seat',{checks:h.checks.map(c=>c.label), lines:out.length});

}

function moveTo(id){

function doMove(src, id){
  const tb=tableById(id), from=src.tables.slice();

  logEv('move_tab',{tab:src.id, from, to:id, guests:src.guests});
  const back=S.move.from==='register'; S.move=null;

}
function mergeTabs(src, dst, mode){

  else { src.lines.forEach(l=>l.chk=dst.cur); dst.seatWarn=true; }

  S.transfers.forEach(x=>x.tabIds=x.tabIds.filter(id=>id!==src.id)); S.transfers=S.transfers.filter(x=>x.tabIds.length);

const ALLERGEN_FALLBACK=['Milk','Eggs','Fish','Shellfish','Tree nuts','Peanuts','Wheat','Soy','Sesame'];
function allergenList(){ const g=(S.live.mods.groups||[]).find(x=>x.id==='allergen'); return g&&g.items.length ? g.items.map(i=>i.name) : ALLERGEN_FALLBACK; }
const ALG_ALIAS={dairy:'milk',cheese:'milk',butter:'milk',gluten:'wheat',egg:'eggs','tree nut':'tree nuts',nuts:'tree nuts',nut:'tree nuts',shellfish:'shellfish',crustacean:'shellfish'};
const algKey = s => { const k=String(s).trim().toLowerCase(); return ALG_ALIAS[k]||k; };

function allergyHits(l, tab){

  const p=lprod(l.pid); const has=new Set([...(p&&p.allergens||[]), ...(l.mods||[]).filter(m=>m.alert).map(m=>m.name)].map(algKey));

/* ---------- happy hour: a weekly schedule; pricing is set per menu or per item ---------- */
const HH_DEFAULT = {0:['17:00','21:00'], 4:['16:00','18:00'], 5:['16:00','17:30'], 6:['16:00','17:30']};
const DAY_NAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const HH_TYPES=[['none','No happy hour'],['off','$ off'],['pct','% off'],['price','Set price']];
S.tOff = 0; /* test-time offset for the prototype */
const nowMs = () => Date.now() + (S.tOff||0);
function hhCfg(lib){ return (lib.settings && lib.settings.hh) || {schedule:HH_DEFAULT, menus:{}}; }
function hhWindow(lib, t){
  const d=new Date(t), sch=hhCfg(lib).schedule[d.getDay()]; if(!sch||!sch[0]||!sch[1]) return null;
  const at = hm => { const [h,m]=hm.split(':').map(Number); const x=new Date(d); x.setHours(h,m,0,0); return x.getTime(); };
  return {start:at(sch[0]), end:at(sch[1])};
}
function hhNow(lib, t){ t=t||nowMs(); const w=hhWindow(lib,t); if(!w) return {active:false}; const active=t>=w.start&&t<w.end;
  return {active, start:w.start, end:w.end, near: Math.abs(t-w.end)<=5*60000 && t>=w.start, left:w.end-t}; }
/* item rule wins; otherwise its primary menu, then its other menus, then their parent menus */
function hhRule(lib, p){
  if(!p) return null;
  if(p.hh && p.hh.type && p.hh.type!=='inherit') return p.hh.type==='none' ? null : {...p.hh, from:'item'};
  const menus=hhCfg(lib).menus||{}, par=parentsOf(lib), order=[p.primary, ...p.cats].filter(Boolean);
  const tryC = c => { const r=menus[c]; return r && r.type && r.type!=='none' ? {...r, from:c} : null; };
  for(const c of order){ const r=tryC(c); if(r) return r; }
  for(const c of order){ if(par[c]){ const r=tryC(par[c]); if(r) return r; } }
  return null;
}
function hhPrice(rule, price, p){
  if(!rule || !(rule.value>0)) return null;
  if(rule.type==='off') return Math.max(0, price-rule.value);
  if(rule.type==='pct') return Math.max(0, Math.round(price*(1-Math.min(100,rule.value)/100)*100)/100); /* exact to the cent: guests can see the % and do the math */
  if(rule.type==='price') return isItem(p) ? rule.value : null;
  return null;
}
const hhLabel = r => !r ? '' : r.type==='off' ? '$'+r.value+' off' : r.type==='pct' ? r.value+'% off' : r.type==='price' ? 'HH $'+r.value : '';
const clock12 = t => new Date(t).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
/* called by addLine: prices the line and, near the end of the window, asks */
function hhPriceLine(l){
  if(l.basePrice!=null){ l.price=l.basePrice; } delete l.hh; delete l.hhWin; delete l.basePrice;
  const p=lprod(l.pid), rule=hhRule(S.live, p), st=hhNow(S.live);
  if(st.active) l.hhWin=true;
  if(!rule) return null;
  const hp=hhPrice(rule, l.price, p); if(hp==null || hp===l.price) return null;
  /* basePrice marks a line happy hour actually touched (applied or prompted), so reporting can trust it */
  if(st.active || st.near) l.basePrice=l.price;
  if(st.active) { l.price=hp; l.hh={type:rule.type, value:rule.value, from:rule.from}; }
  return st.near ? {hp, base:l.basePrice, st, rule} : null;
}
function hhAsk(l, q){
  const ended = q.st.left<=0, mins=Math.max(0,Math.round(Math.abs(q.st.left)/60000));
  xOpen(`<div><h2 class="ftitle">${ended?`Happy hour ended ${mins?mins+' min ago':'just now'}`:`Happy hour ends in ${mins||'under 1'} min`}</h2><span class="muted">${esc((lprod(l.pid)||{}).name||'Item')} · ${esc(l.label)}. Ends ${clock12(q.st.end)}.</span></div>
    <div class="rmkinds"><button class="rmk" id="hh-yes"><b>Happy hour · ${cash(q.hp)}</b><span>${esc(hhLabel(q.rule))}</span></button><button class="rmk" id="hh-no"><b>Regular · ${cash(q.base)}</b><span>Standard price</span></button></div>`, {sticky:true});

/* ---------- split one item: separate part of a quantity, or divide it into parts ---------- */
function splitLineParts(l, n, spread){
  const h=curHost(); ensureChecks(h); const ls=hostLines(h), at=ls.indexOf(l); if(at<0) return;
  const parts=Array.from({length:n},()=>{ const c=cloneLine(l); c.part=partOf(l)/n; if(c.adj&&c.adj.amt) c.adj.amt=c.adj.amt/n; return c; });
  if(spread){
    const cur=lineChk(l,h), order=[cur, ...h.checks.map(c=>c.id).filter(id=>id!==cur)];
    while(order.length<n){ const c={id:newCid(), seat:null, label:'', adj:null}; h.checks.push(c); order.push(c.id); }
    parts.forEach((p,i)=>p.chk=order[i]); relabelChecks(h);
  } else parts.forEach(p=>p.chk=lineChk(l,h));
  ls.splice(at,1,...parts);
  logEv('item_split',{how:'parts', parts:n, spread:!!spread, pid:l.pid, line:l.label, qty:qtyOf(l), gross:+lineGross(l).toFixed(2)});
}
function splitLineQty(l, k, target){
  const h=curHost(); ensureChecks(h); const ls=hostLines(h), at=ls.indexOf(l); if(at<0 || k<1 || k>=qtyOf(l)) return;
  const q=qtyOf(l), c=cloneLine(l); c.qty=k; l.qty=q-k;
  if(l.adj&&l.adj.amt){ c.adj.amt=l.adj.amt*k/q; l.adj.amt=l.adj.amt*(q-k)/q; }
  if(target==='new'){ const nc={id:newCid(), seat:null, label:'', adj:null}; h.checks.push(nc); relabelChecks(h); c.chk=nc.id; } else c.chk=target||lineChk(l,h);
  ls.splice(at+1,0,c);
  logEv('item_split',{how:'qty', moved:k, of:q, to:chkById(h,c.chk).label, pid:l.pid, line:l.label});
}

/* ---------- send across checks: one send covers the tab unless you say otherwise ---------- */
function askSendScope(mode, pool, go){
  const h=curHost(); ensureChecks(h); const cur=h.cur;
  const by={}; pool.forEach(l=>{ const c=lineChk(l,h); by[c]=(by[c]||0)+qtyOf(l); });
  const ids=Object.keys(by); if(ids.length<2) return go(null);
  const all=pool.reduce((a,l)=>a+qtyOf(l),0), mine=by[cur]||0;
  xOpen(`<div><h2 class="ftitle">Unsent items on ${ids.length} checks</h2><span class="muted">${ids.map(id=>`${esc(chkById(h,id).label)}: ${by[id]}`).join(' · ')}</span></div>
    <div class="rmkinds"><button class="rmk sdef" id="ss-all"><b>Send all checks · ${all} item${all===1?'':'s'}</b><span>Everything unsent on this tab goes.</span></button>
    <button class="rmk" id="ss-one" ${mine?'':'disabled'}><b>Only ${esc(chkById(h,cur).label)} · ${mine}</b><span>${mine?'Other checks stay unsent.':'Nothing unsent on this check.'}</span></button></div>
    <div class="row-btns"><button class="btn" id="ss-cancel">Cancel</button></div>`);
  $('#ss-all').onclick=()=>{ xClose(); logEv('send_scope',{mode, scope:'all', checks:ids.length}); go(null); };
  $('#ss-one').onclick=()=>{ xClose(); logEv('send_scope',{mode, scope:'check', check:chkById(h,cur).label}); go(cur); };
  $('#ss-cancel').onclick=xClose;
  $('#ss-all').focus();
}
const sendPool = () => S.sendScope ? S.ticket.filter(l=>lineChk(l,curHost())===S.sendScope) : S.ticket;

/* ---------- send / stay / hold / send new ---------- */
function sendBarHtml(){
  const news=S.ticket.filter(l=>statusOf(l)==='new'), held=S.ticket.filter(l=>statusOf(l)==='held');
  const heldCourses=[...new Set(held.filter(l=>l.course).map(l=>l.course))].sort((a,b)=>courseRank(a)-courseRank(b));

    ${heldCourses.length || (sel&&statusOf(sel)==='held') ? `<div class="firebar"><span class="lbl">Held</span>${heldCourses.map(c=>`<button class="btn sm" data-firec="${c}">Fire ${esc(courseName(c))} <span class="num">${held.filter(l=>l.course===c).length}</span></button>`).join('')}${sel&&statusOf(sel)==='held'?`<button class="btn sm" id="s-firesel">Fire selected item</button>`:''}</div>`:''}
    ${held.some(l=>!l.course)?`<p class="muted" style="font-size:12px;margin:6px 0 0">Held items without a course fire one at a time: select the item, then Fire selected item.</p>`:''}
    <p class="note" id="send-note"></p>`;

function doneLines(lines, how){
  const now=new Date().toISOString();
  lines.forEach(l=>{ l.status='done'; l.doneAt=now; });
  if(lines.length) logEv('fulfil', {how, lines:lines.map(l=>({pid:l.pid, line:l.label, qty:qtyOf(l), firedAt:l.firedAt}))});
}
function fireLines(lines, how){
  const now=new Date().toISOString();
  lines.forEach(l=>{ l.status='fired'; l.firedAt=now; });
  if(lines.length) logEv('fire', {how, lines:lines.map(l=>({pid:l.pid, line:l.label, qty:qtyOf(l), course:l.course?courseName(l.course):null}))});
}
function holdLines(lines, how){
  const now=new Date().toISOString();
  lines.forEach(l=>{ l.status='held'; l.heldAt=now; });
  if(lines.length) logEv('hold', {how, lines:lines.map(l=>({pid:l.pid, line:l.label, qty:qtyOf(l), course:l.course?courseName(l.course):null}))});
}
function bindSendBar(){
  const note = t => { const n=$('#send-note'); if(n) n.textContent=t; };
  const blocked = () => { const bi=S.ticket.findIndex(l=>!isSent(l) && unmetFor(l).length); if(bi<0) return false; S.modLine=bi; S.sel=null; S.custom=false; renderLeft(); renderTicket(); note('Finish the required modifiers before sending.'); return true; };
  const done = (mode) => { S.modLine=null; if(mode==='send'){ S.view='floor'; render(); } else { renderTicket(); renderLeft(); } };
  const startSend = (mode, scope) => {
    if(blocked()) return;
    if(scope===undefined){ const pool=S.ticket.filter(l=>statusOf(l)==='new' || (statusOf(l)==='held' && l.course)); if(!pool.length) return note('Nothing to send.'); return askSendScope(mode, pool, sc=>startSend(mode, sc)); }
    S.sendScope=scope;
    const eligible=sendPool().filter(l=>statusOf(l)==='new' || (statusOf(l)==='held' && l.course));
    if(!eligible.length) return note('Nothing to send.');
    const courses=[...new Set(eligible.filter(l=>l.course).map(l=>l.course))].sort((a,b)=>courseRank(a)-courseRank(b));
    if(courses.length>=1){ S.sendPrompt={mode, courses, sel:[courses[0]]}; renderSendPrompt(); return; }
    finishSend(mode, courses);
  };
  if($('#s-send')) $('#s-send').onclick=()=>startSend('send');
  if($('#s-stay')) $('#s-stay').onclick=()=>startSend('stay');
  if($('#s-hold')) $('#s-hold').onclick=()=>{ if(blocked()) return; holdLines(S.ticket.filter(l=>statusOf(l)==='new'),'hold'); done('hold'); };
  if($('#s-new')) $('#s-new').onclick=()=>{ if(blocked()) return; const pool=S.ticket.filter(l=>statusOf(l)==='new'); askSendScope('send_new', pool, sc=>{ S.sendScope=sc; fireLines(sendPool().filter(l=>statusOf(l)==='new'),'send_new'); S.sendScope=null; done('new'); }); };
  document.querySelectorAll('[data-firec]').forEach(b=>b.onclick=()=>{ fireLines(S.ticket.filter(l=>statusOf(l)==='held' && l.course===b.dataset.firec),'fire_course'); done('stay'); });
  if($('#k-all')) $('#k-all').onclick=()=>{ doneLines(S.ticket.filter(l=>statusOf(l)==='fired'),'test_all'); done('stay'); };
  if($('#k-sel')) $('#k-sel').onclick=()=>{ const l=S.ticket[S.modLine]; if(l&&statusOf(l)==='fired'){ doneLines([l],'test_item'); done('stay'); } };
  if($('#s-firesel')) $('#s-firesel').onclick=()=>{ const l=S.ticket[S.modLine]; if(l&&statusOf(l)==='held'){ fireLines([l],'fire_item'); done('stay'); } };
}
function finishSend(mode, selCourses){
  const fire=[], hold=[];
  sendPool().forEach(l=>{ const st=statusOf(l);
    if(st==='new'){ if(!l.course || selCourses.includes(l.course)) fire.push(l); else hold.push(l); }
    else if(st==='held' && l.course && selCourses.includes(l.course)) fire.push(l);
  });
  fireLines(fire, mode); holdLines(hold, mode+'_coursed'); S.sendScope=null;
  S.sendPrompt=null; renderSendPrompt();
  S.modLine=null; if(mode==='send'){ S.view='floor'; render(); } else { renderTicket(); renderLeft(); }
}
/* pending items: a check with new, uncoursed lines can't be left until they are sent, held, coursed or discarded */

function workCopy(){ return {products:S.products, categories:S.categories, settings:S.settings, mods:S.mods}; }

  S.products=clone(src.products); S.categories=clone(src.categories); S.settings=clone(src.settings||{unit:'oz'}); S.mods=clone(src.mods);
  if(!prod(S.libSel)) S.libSel=S.products[0]?S.products[0].id:null;

function renderPubBar(){
  const el=$('#pubbar'); if(!el) return;
  const st=pubState();
  const tone = st.dirty ? 'dirty' : st.unpub ? 'draft' : 'clean';
  const status = st.dirty ? (st.unpub ? 'Unsaved edits · saved draft not yet published' : 'Unsaved edits')
               : st.unpub ? 'Draft saved · not yet published' : 'Published · no pending changes';
  const ask = { discard:'Discard edits since your last save?', revert:'Drop every change since the last publish, including the saved draft?' }[S.confirm];
  el.innerHTML = `<div class="pstat ${tone}"><span class="dot" aria-hidden="true"></span><span>${status}</span></div>
    <div class="pacts">${ask
      ? `<span class="warnbox">${ask}</span><button class="btn" id="cf-no">Keep editing</button><button class="btn danger" id="cf-yes">${S.confirm==='revert'?'Revert':'Discard'}</button>`
      : `<button class="btn" id="pb-discard" ${st.dirty?'':'disabled'}>Discard edits</button>
         <button class="btn" id="pb-revert" ${st.diffLive?'':'disabled'}>Revert to published</button>

         <button class="btn pub" id="pb-pub" ${st.diffLive?'':'disabled'}>Publish</button>`}</div>`;
  if(ask){
    $('#cf-no').onclick=()=>{ S.confirm=null; renderPubBar(); };
    $('#cf-yes').onclick=()=>{
      logEv(S.confirm==='revert'?'library_revert':'library_discard');

      loadWork(S.saved); S.confirm=null; renderLibrary();

  $('#pb-revert').onclick=()=>{ S.confirm='revert'; renderPubBar(); };

  };

      if(S.renaming===c) return `<form class="mrow catform" id="renform" data-i="${i}"><input id="ren-in" value="${esc(c)}" maxlength="40" aria-label="New name for ${esc(c)}" autocomplete="off"><button class="btn" type="submit">Save</button><button class="btn" type="button" id="ren-cancel">Cancel</button></form><div class="warnbox" id="renerr"></div>`;
      if(S.delCat===c){ const n=count(c); return `<div class="mrow conf"><span>Delete <b>${esc(c)}</b>?${n?` It comes off ${n} product${n>1?'s':''}. The products stay.`:''}</span><span class="acts"><button class="btn" id="del-keep">Keep</button><button class="btn danger" data-dodel="${i}">Delete</button></span></div>`; }
      const hasKids = Object.values(par).includes(c);

      return `<div class="mrow"><span class="mn">${par[c]?`<span class="muted">${esc(par[c])} ›</span> `:''}${esc(c)} <span class="cc">${count(c)}</span></span><span class="acts">${parentSel}<button class="linkbtn" data-rn="${i}">Rename</button><button class="linkbtn dl" data-dl="${i}">Delete</button></span></div>`;
    }).join('') || '<p class="empty">No categories yet.</p>'}</div>`;
  } else {
    catHtml = `<div class="chips libchips">${['All',...S.categories].map(c=>`<button class="chip" data-lc="${esc(c)}" aria-pressed="${S.libCat===c}">${esc(c)} <span class="cc">${count(c)}</span></button>`).join('')}</div>`;
  }
  el.innerHTML = `
    <div class="f"><span class="lbl">Register ring-in unit</span><div class="seg" role="group" aria-label="Ring-in unit">${['oz','ml'].map(u=>`<button type="button" data-unit="${u}" aria-pressed="${S.settings.unit===u}">${u==='oz'?'oz':'mL'}</button>`).join('')}</div><span class="h">How bartenders type custom pours and read volumes. Applies when published.</span></div>
    <label class="f"><span class="lbl">Search</span><input id="lib-q" type="search" placeholder="Name or category" value="${esc(S.libQuery)}" autocomplete="off"></label>
    <div><div class="lhead"><span class="lbl">Categories</span><button class="linkbtn" id="cat-manage">${S.manageCats?'Done':'Manage'}</button></div>${catHtml}</div>
    ${S.addingCat
      ? `<form id="catform" class="catform"><input id="cat-new" placeholder="Category name" maxlength="40" autocomplete="off" aria-label="New category name"><button class="btn" type="submit">Add</button><button class="btn" type="button" id="cat-cancel">Cancel</button></form><div class="warnbox" id="caterr"></div>`
      : `<button class="linkbtn" id="cat-add">+ New category</button>`}`;
  const refresh = ()=>{ renderTools(); renderPList(); renderForm(); };
  $('#lib-q').addEventListener('input', e=>{ S.libQuery = e.target.value; renderPList(); });
  el.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{ S.settings.unit=b.dataset.unit; touch(); renderTools(); });
  $('#cat-manage').onclick = ()=>{ S.manageCats=!S.manageCats; S.renaming=null; S.delCat=null; renderTools(); };
  el.querySelectorAll('[data-lc]').forEach(b=>b.onclick=()=>{ S.libCat=b.dataset.lc; renderTools(); renderPList(); });
  el.querySelectorAll('[data-rn]').forEach(b=>b.onclick=()=>{ S.renaming=S.categories[+b.dataset.rn]; S.delCat=null; renderTools(); const i=$('#ren-in'); i.focus(); i.select(); });
  el.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{ S.delCat=S.categories[+b.dataset.dl]; S.renaming=null; renderTools(); });
  el.querySelectorAll('[data-dodel]').forEach(b=>b.onclick=()=>{ deleteCat(S.categories[+b.dataset.dodel]); S.delCat=null; refresh(); });
  el.querySelectorAll('[data-par]').forEach(sel=>sel.addEventListener('change',()=>{ const c=S.categories[+sel.dataset.par]; if(sel.value) par[c]=sel.value; else delete par[c]; save(); renderTools(); renderPList(); }));
  if($('#del-keep')) $('#del-keep').onclick = ()=>{ S.delCat=null; renderTools(); };
  if($('#renform')){
    $('#ren-cancel').onclick = ()=>{ S.renaming=null; renderTools(); };
    $('#renform').addEventListener('submit', e=>{
      e.preventDefault();
      const old=S.renaming, nu=$('#ren-in').value.trim().replace(/\s+/g,' ');
      const err=catNameErr(nu, old); if(err){ $('#renerr').textContent=err; return; }
      if(nu!==old) renameCat(old, nu);
      S.renaming=null; refresh();
    });
  }
  if(S.addingCat){
    const inp = $('#cat-new'); inp.focus();
    $('#cat-cancel').onclick = ()=>{ S.addingCat=false; renderTools(); };
    $('#catform').addEventListener('submit', e=>{
      e.preventDefault();
      const name = inp.value.trim().replace(/\s+/g,' ');
      const err = catNameErr(name); if(err){ $('#caterr').textContent=err; return; }
      S.categories.push(name); saveCats(); S.addingCat=false; if(!S.manageCats) S.libCat=name;
      refresh();
    });
  } else $('#cat-add').onclick = ()=>{ S.addingCat=true; renderTools(); };
}
function renderPList(){
  const list = S.products.filter(libMatches);
  $('#plist').innerHTML = (list.length
      ? list.map(p=>`<button data-lp="${p.id}" aria-current="${p.id===S.libSel}"><span class="n">${esc(p.name||'Untitled product')}</span><span class="m">${p.cats.length?`<b class="prim">${esc(p.primary)}</b>`+p.cats.filter(c=>c!==p.primary).map(c=>', '+esc(c)).join(''):'No category'} · ${isItem(p)?money(p.price)+(p.placeholder?' (placeholder)':'')+' · menu item':p.size+' mL · '+p.basis}</span></button>`).join('')
      : `<p class="empty">No products match${S.libQuery.trim()?` “${esc(S.libQuery.trim())}”`:''}${S.libCat!=='All'?` in ${esc(S.libCat)}`:''}.</p>`)
    + `<button id="newp" class="btn" style="margin-top:8px;align-items:center">+ New product${S.libCat!=='All'?' in '+esc(S.libCat):''}</button>
       <button id="reset" class="btn" style="align-items:center">Reset to examples</button>`;
  $('#plist').querySelectorAll('[data-lp]').forEach(b=>b.onclick=()=>{S.libSel=b.dataset.lp;S.confirmDel=false;renderPList();renderForm();});
  $('#newp').onclick=()=>{
    const id='p'+Date.now();
    S.products.push({id,name:'New product',cats:S.libCat!=='All'?[S.libCat]:[],primary:S.libCat!=='All'?S.libCat:null,size:750,pack:12,cost:{frontline:null,net:null,sale:null},basis:'net',scale:{min:15,max:25},servings:[{label:'',qty:1.5,unit:'oz',target:20,override:null,basis:'net'}]});
    S.libSel=id; S.libQuery=''; save(); renderTools(); renderPList(); renderForm();
  };
  $('#reset').onclick=()=>{S.products=JSON.parse(JSON.stringify(SEED)).map(norm);S.inv=seedInv();saveInv();S.cat='All';S.manageCats=false;S.renaming=null;S.delCat=null;S.categories=DEFAULT_CATS.slice(); { const l=migrateLib({products:S.products, categories:S.categories, settings:{unit:S.settings.unit}}); S.categories=l.categories; S.settings=l.settings; S.mods=l.mods; }S.libCat='All';S.libQuery='';S.libSel=S.products[0].id;S.ticket=[];save();renderLibrary();};
}

function numOrNull(v){ const n=parseFloat(v); return isNaN(n)?null:n; }

function renderForm(){
  const p=prod(S.libSel), el=$('#pform');

  if(isItem(p)) return renderItemForm(p, el);
  el.innerHTML = `
  <div class="form">
    <div class="fs"><h3>Product</h3>
      <div class="fields">
        <label class="f" style="grid-column:span 2"><span class="lbl">Name</span><input id="f-name" value="${esc(p.name)}"></label>

    </div>
    <div class="fs"><h3>Standard pours</h3>

      <div class="scroll"><table class="tbl" id="servtbl">

        <tbody>${p.servings.map((s,i)=>`<tr data-r="${i}">
          <td><input data-f="label" value="${esc(s.label||'')}" placeholder="${esc(s.qty+' '+s.unit)}"></td>
          <td style="width:80px"><input data-f="qty" type="number" min="0" step="0.25" value="${s.qty}"></td>
          <td style="width:76px"><select data-f="unit"><option value="oz" ${s.unit==='oz'?'selected':''}>oz</option><option value="ml" ${s.unit==='ml'?'selected':''}>mL</option></select></td>
          <td style="width:112px"><select data-f="basis">${['frontline','net','sale'].map(k=>`<option value="${k}" ${(s.basis||p.basis)===k?'selected':''}>${basisName(k)}</option>`).join('')}</select></td>
          <td style="width:84px"><input data-f="target" type="number" min="1" max="100" step="0.5" value="${s.target}"></td>
          <td style="width:92px"><input data-f="override" type="number" min="0" step="1" value="${s.override??''}" placeholder="—"></td>
          <td class="num" data-out="price"></td><td class="num" data-out="actual"></td>
          <td><button class="x" data-rm="${i}" aria-label="Remove pour">×</button></td></tr>`).join('')}</tbody>
      </table></div>
      <div><button class="btn" id="addserv">+ Add pour</button></div>
    </div>
    <div class="fs"><h3>Custom pour sliding scale</h3>
      <div class="fields">
        <label class="f"><span class="lbl">Smallest bucket %</span><input id="s-min" type="number" min="1" max="100" step="0.5" value="${p.scale.min}"></label>
        <label class="f"><span class="lbl">Full container %</span><input id="s-max" type="number" min="1" max="100" step="0.5" value="${p.scale.max}"></label>

        <div class="basis" style="margin-top:6px">${['frontline','net','sale'].map(k=>`<label><input type="radio" name="basis" value="${k}" ${p.basis===k?'checked':''}>${k[0].toUpperCase()+k.slice(1)}</label>`).join('')}</div>
      </div>

    ${hhItemHtml(p)}
    ${modSectionHtml()}

      <span class="muted" style="font-size:12px">Edits stay in this draft until you save or publish.</span>
      <span id="delwrap"></span>
    </div>
  </div>`;

  const bind=(id,fn)=>{$(id).addEventListener('input',e=>{fn(e.target.value);save();derived();});};
  bind('#f-name',v=>{p.name=v;renderPList();});
  function renderPrimary(){
    $('#primwrap').innerHTML = `<select id="f-primary" ${p.cats.length?'':'disabled'}>${p.cats.length ? p.cats.map(c=>`<option ${p.primary===c?'selected':''}>${esc(c)}</option>`).join('') : '<option>Tag a category first</option>'}</select>`;
    el.querySelectorAll('#tagpick .tag').forEach(t=>t.dataset.primary = String(t.dataset.c===p.primary));
    $('#f-primary').addEventListener('change', e=>{ p.primary=e.target.value; save(); renderPrimary(); renderPList(); });
  }
  el.querySelectorAll('#tagpick input').forEach(cb=>cb.addEventListener('change',()=>{ p.cats = S.categories.filter(c=> c===cb.value ? cb.checked : p.cats.includes(c)); fixPrimary(p); save(); renderPrimary(); renderTools(); renderPList(); }));
  renderPrimary();
  bind('#f-size',v=>{const n=numOrNull(v);if(n>0)p.size=n;renderPList();});
  $('#f-onhand').addEventListener('change',e=>{ logEv('count_set',{pid:p.id, product:p.name, to:numOrNull(e.target.value), via:'library'}); });
  $('#f-onhand').addEventListener('input',e=>{const n=numOrNull(e.target.value);if(n!=null&&n>=0){S.inv[p.id]=n;saveInv();derived();}});
  bind('#f-pack',v=>{const n=numOrNull(v);if(n>0)p.pack=Math.round(n);});
  ['frontline','net','sale'].forEach(k=>bind('#c-'+k,v=>{p.cost[k]=numOrNull(v);}));
  el.querySelectorAll('input[name=basis]').forEach(r=>r.addEventListener('change',()=>{p.basis=r.value;save();renderPList();derived();}));
  bind('#s-min',v=>{const n=numOrNull(v);if(n>0)p.scale.min=n;});
  bind('#s-max',v=>{const n=numOrNull(v);if(n>0)p.scale.max=n;});
  $('#servtbl').addEventListener('input',e=>{
    const tr=e.target.closest('tr[data-r]'); if(!tr) return; const s=p.servings[+tr.dataset.r], f=e.target.dataset.f;
    if(f==='label') s.label=e.target.value;
    else if(f==='unit') s.unit=e.target.value;
    else if(f==='basis') s.basis=e.target.value;
    else if(f==='override') s.override=numOrNull(e.target.value);
    else { const n=numOrNull(e.target.value); if(n!=null&&n>0) s[f]=n; }
    save(); derived();
  });
  $('#servtbl').addEventListener('change',e=>{ const f=e.target.dataset.f; if(f==='unit'||f==='basis'){ const tr=e.target.closest('tr'); p.servings[+tr.dataset.r][f]=e.target.value; save(); derived(); }});

  $('#addserv').onclick=()=>{p.servings.push({label:'',qty:2,unit:'oz',target:20,override:null,basis:p.basis});save();renderForm();};
  renderDel(p); renderItemMods(p);
  derived();

  function derived(){
    const c=basisCost(p), r=perMl(p);
    $('#h-size').textContent = (p.size/OZ).toFixed(1)+' oz · bucket every '+Math.round(p.size/10)+' mL';
    $('#countinfo').textContent = 'From the current count ('+fmtBtl(invOf(p.id))+' bottles, '+fmtTotal(invOf(p.id)*p.size)+'): '+(p.servings.map(s=>servLabel(s)+' × '+Math.max(0,Math.floor(invOf(p.id)*p.size/servingMl(s)+1e-9))).join(' · ')||'no pours set')+'.';
    $('#basiswarn').textContent = c?'':`Custom pours use ${p.basis} cost, which is empty. Enter it or pick another cost.`;
    $('#permlinfo').textContent = r?`${money2(c)} ÷ ${p.size} mL = ${'$'+r.toFixed(4)}/mL · ${money2(r*OZ)}/oz`:'';
    p.servings.forEach((s,i)=>{
      const tr=$(`#servtbl tr[data-r="${i}"]`); if(!tr) return; const q=stdPrice(p,s);
      tr.querySelector('[data-out=price]').innerHTML = q.price?`<span class="num">${money(q.price)}</span> <span class="pill ${q.over?'ov':''}">${q.over?'override':'target'}</span>`:`<span class="warnbox">no ${q.basis} cost</span>`;
      tr.querySelector('[data-out=actual]').innerHTML = q.actual?`<span class="num">${pctf(q.actual)}</span>`:'—';
    });
    const step=p.size/10;
    $('#scaletbl').innerHTML = `<thead><tr><th>Bucket</th><th>Pours from</th><th>Up to</th><th class="num">Cost target</th><th class="num">Price at top of bucket</th><th class="num">$/oz to guest</th></tr></thead><tbody>${
      Array.from({length:10},(_,i)=>{
        const b=i+1, pct=p.scale.min+(p.scale.max-p.scale.min)*i/9, hi=b*step, lo=i*step, pr=priceAt(p,hi,pct);
        return `<tr><td class="num">${b}</td><td class="num">${(lo>0?Math.round(lo)+1:1)} mL</td><td class="num">${Math.round(hi)} mL · ${(hi/OZ).toFixed(1)} oz</td><td class="num">${pctf(pct)}</td><td class="num">${pr?money(pr):'—'}</td><td class="num">${pr?money2(pr/(hi/OZ)):'—'}</td></tr>`;
      }).join('')}</tbody>`;
  }
}
function renderItemForm(p, el){

  $('#i-sec').addEventListener('input',e=>{ p.section=e.target.value; save(); });

  function renderPrimary(){
    $('#primwrap').innerHTML = `<select id="f-primary" ${p.cats.length?'':'disabled'}>${p.cats.length ? p.cats.map(c=>`<option ${p.primary===c?'selected':''}>${esc(c)}</option>`).join('') : '<option>Tag a category first</option>'}</select>`;
    el.querySelectorAll('#tagpick .tag').forEach(t=>t.dataset.primary = String(t.dataset.c===p.primary));
    $('#f-primary').addEventListener('change', e=>{ p.primary=e.target.value; save(); renderPrimary(); renderPList(); });
  }
  el.querySelectorAll('#tagpick input').forEach(cb=>cb.addEventListener('change',()=>{ p.cats = S.categories.filter(c=> c===cb.value ? cb.checked : p.cats.includes(c)); fixPrimary(p); save(); renderPrimary(); renderTools(); renderPList(); }));
  renderPrimary(); costLine(); renderDel(p); renderItemMods(p);
}
function renderDel(p){
  const w=$('#delwrap');
  w.innerHTML = S.confirmDel
    ? `<span style="display:inline-flex;gap:8px;align-items:center"><span class="warnbox">Delete ${esc(p.name)}?</span><button class="btn" id="delno">Keep</button><button class="btn" id="delyes" style="color:var(--warn)">Delete</button></span>`
    : `<button class="btn" id="del">Delete product</button>`;
  if(S.confirmDel){
    $('#delno').onclick=()=>{S.confirmDel=false;renderDel(p);};
    $('#delyes').onclick=()=>{S.products=S.products.filter(x=>x.id!==p.id);S.confirmDel=false;S.libSel=S.products[0]?S.products[0].id:null;if(S.sel===p.id)S.sel=null;save();renderLibrary();};
  } else $('#del').onclick=()=>{S.confirmDel=true;renderDel(p);};
}

S.log = store.get('log', []);
const LOG_CAP = 5000; /* prototype limit for browser storage; the real build keeps everything */
const TAB_EVENTS = ['check_move_item','split_by_seat','check_add','check_combine','guest_change','allergy_add','allergy_remove','check_request','check_discount','check_comp','ring_in','void_line','void_all','remove_unsent','adjust_request','adjust_discount','adjust_comp','adjust_void','modifier_add','modifier_remove','open_tab','tab_edit'];
function logEv(type, data={}){
  const ts=new Date().toISOString();
  if(TAB_EVENTS.includes(type)){ const t=S.tabs.find(x=>x.id===S.activeTab); if(t) t.modified=ts; else S.quickMod=ts; }
  /* library actions aren't tab activity: don't stamp them with whatever tab was last open */
  S.log.push({ts, type, user:S.user||null, tab:(S.view==='library'?null:S.activeTab)||null, ...data});
  if(S.log.length>LOG_CAP) S.log.splice(0, S.log.length-LOG_CAP);
  store.set('log', S.log);
}

function isOut(p){ const ov=S.availOv[p.id]; if(ov==='86') return true; if(ov==='available') return false; if(isItem(p)) return false; return remainingMl(p) <= 1e-6; }

function longPress(el, fn){
  let t=null, fired=false, sx=0, sy=0;
  const cancel=()=>{ clearTimeout(t); t=null; };
  el.addEventListener('pointerdown',e=>{ fired=false; sx=e.clientX; sy=e.clientY; cancel(); t=setTimeout(()=>{ fired=true; fn(); }, 550); });
  el.addEventListener('pointerup',cancel); el.addEventListener('pointerleave',cancel); el.addEventListener('pointercancel',cancel);
  el.addEventListener('pointermove',e=>{ if(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8) cancel(); });
  el.addEventListener('contextmenu',e=>{ e.preventDefault(); cancel(); fired=true; fn(); });
  el.addEventListener('click',e=>{ if(fired){ e.stopImmediatePropagation(); e.preventDefault(); fired=false; } }, true);
}

const childrenOf = (lib, c) => Object.keys(parentsOf(lib)).filter(k=>parentsOf(lib)[k]===c);
