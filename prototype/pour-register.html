/* ---------- modifier configuration (lives in the library: draft → publish) ---------- */
const RULES = [['required','Required'],['force','Shown automatically'],['optional','Optional']];
const ruleName = r => (RULES.find(x=>x[0]===r)||RULES[2])[1];
function seatGroup(){ return {id:'seat', kind:'seat', name:'Seats', multi:true, items:[]}; }
function courseGroup0(){ return {id:'course', kind:'course', name:'Course', multi:false, items:['Drinks','Course 1','Course 2','Course 3','Dessert'].map((n,i)=>({id:'c'+i, name:n, price:0, link:null}))}; }
function seedMods(lib){
  const byName = n => (lib.products.find(p=>p.name===n)||{}).id;
  const g = (id, name, multi, items, extra={}) => ({id, name, multi, items:items.map((x,i)=>({id:id+'-'+i, name:x[0], price:x[1]||0, link:x[2]||null})), ...extra});
  const groups = [
    seatGroup(),
    courseGroup0(),
    g('general','General',true,[['No make'],['To go'],['Rush'],['On the side'],['Light'],['Extra']]),
    g('cocktail','Cocktail styles',false,[['Old Fashioned',4],['Manhattan',4],['Martini',3],['Negroni',5],['Cosmo',4],['Sour',3],['Mule',3],['Highball',2]]),
    g('allergen','Allergens',true,[['Milk'],['Eggs'],['Fish'],['Shellfish'],['Tree nuts'],['Peanuts'],['Wheat'],['Soy'],['Sesame']],{alert:true}),
    g('milk','Milk',false,[['Whole'],['Oat',1],['Skim'],['Half & half'],['No milk']]),
    g('temp','Temperature',false,[['Rare'],['Medium rare'],['Medium'],['Medium well'],['Well']]),
    g('tinct','Tonics & Tinctures',true,[['Aplos Arise 1 oz',9,{pid:'pb239',ml:OZ}],['Aplos Calme 1 oz',9,{pid:'pb240',ml:OZ}],['Aplos Ease 1 oz',9,{pid:'pb238',ml:OZ}]]),
  ];
  const a = (gid, rule='optional') => ({gid, rule});
  const menus = {
    'Spirits':[a('seat'),a('course'),a('general'),a('cocktail')], 'Wine':[a('seat'),a('course'),a('general')], 'Beer & Canned':[a('seat'),a('course'),a('general')], 'Non-Alc':[a('seat'),a('course'),a('general'),a('tinct')],
    'Cocktails':[a('seat','force'),a('course'),a('general'),a('allergen'),a('tinct')], 'Cafe Drinks':[a('seat'),a('course'),a('milk','force'),a('general'),a('allergen')],
    'Food':[a('seat','force'),a('course','force'),a('general'),a('allergen')], 'Cheese & Charcuterie':[a('seat','force'),a('course','force'),a('general'),a('allergen')]
  };
  const items = {};
  ['Burger','Steak Au Poivre'].forEach(n=>{ const id=byName(n); if(id) items[id]={inherit:false, groups:[a('seat','required'),a('course','force'),a('temp','required'),a('general'),a('allergen')]}; });
  return {groups, menus, items};
}
function migrateLib(l){
  l.settings = l.settings || {unit:'oz'};
  if(!l.settings.parents){
    l.settings.parents = {};
    Object.entries(seedParents()).forEach(([c,p])=>{ if(l.categories.includes(c)) l.settings.parents[c]=p; });
    ['Spirits','Modifiers','Food'].forEach(p=>{ if(l.categories.includes(p) || !Object.values(l.settings.parents).includes(p)) return; const first=l.categories.findIndex(c=>l.settings.parents[c]===p); l.categories.splice(first<0?l.categories.length:first, 0, p); });
  }
  if(!l.settings.migCheese){ l.settings.migCheese=true; if(l.categories.includes('Cheese & Charcuterie') && !l.settings.parents['Cheese & Charcuterie'] && l.categories.includes('Food')) l.settings.parents['Cheese & Charcuterie']='Food'; }
  /* price overrides cleared for the prototype: standard pours price from their cost target */
  if(!l.settings.migNoOverride){ l.settings.migNoOverride=true; (l.products||[]).forEach(p=>(p.servings||[]).forEach(sv=>{ delete sv.override; })); }
  if(!l.settings.hh) l.settings.hh = {schedule:{0:['17:00','21:00'], 4:['16:00','18:00'], 5:['16:00','17:30'], 6:['16:00','17:30']}, menus:{}};
  if(!l.mods) l.mods = seedMods(l);
  if(!l.mods.groups.some(g=>g.kind==='seat')){
    l.mods.groups.unshift(seatGroup());
    const seed=seedMods(l); Object.entries(seed.menus).forEach(([c,list])=>{ const s=list.find(a=>a.gid==='seat'); if(s && l.mods.menus[c]) l.mods.menus[c].unshift({...s}); });
  }
  if(!l.mods.groups.some(g=>g.kind==='course')){
    const at=l.mods.groups.findIndex(g=>g.kind==='seat'); l.mods.groups.splice(at+1, 0, courseGroup0());
    const seed=seedMods(l); Object.entries(seed.menus).forEach(([c,list])=>{ const s=list.find(a=>a.gid==='course'); if(s && l.mods.menus[c]) l.mods.menus[c].splice(1,0,{...s}); });
    Object.entries(seed.items).forEach(([id,o])=>{ const s=o.groups.find(a=>a.gid==='course'); const cur=l.mods.items[id]; if(s && cur && cur.inherit===false && !cur.groups.some(a=>a.gid==='course')) cur.groups.splice(1,0,{...s}); });
  }
  return l;
}

/* which groups apply to a product: its own setup, or what its categories (and their parents) carry */
function effGroups(p, lib=S.live){
  if(!p) return [];
  const cfg=lib.mods, par=parentsOf(lib);
  let list;
  const own=cfg.items[p.id];
  if(own && own.inherit===false) list=own.groups.map(a=>({...a, from:'Item'}));
  else {
    list=[]; const seen=new Set();
    const take=(c)=>(cfg.menus[c]||[]).forEach(a=>{ if(!seen.has(a.gid)){ seen.add(a.gid); list.push({...a, from:c}); } });
    p.cats.forEach(take); p.cats.forEach(c=>{ if(par[c]) take(par[c]); });
  }
  const rank={required:0, force:1, optional:2};
  return list.map(a=>({...a, g:cfg.groups.find(x=>x.id===a.gid)})).filter(a=>a.g).sort((x,y)=>(kindRank(x.g)-kindRank(y.g)) || rank[x.rule]-rank[y.rule]);
}
const kindRank = g => g.kind==='seat' ? 0 : g.kind==='course' ? 1 : 2;
const hasPick = (l, a) => a.g.kind==='seat' ? (l.seats||[]).length>0 : a.g.kind==='course' ? !!l.course : (l.mods||[]).some(m=>m.gid===a.gid);
const courseG = (lib=S.live) => lib.mods.groups.find(g=>g.kind==='course');
const courseName = id => { const g=courseG(); const it=g&&g.items.find(x=>x.id===id); return it?it.name:''; };
const courseRank = id => { const g=courseG(); const i=g?g.items.findIndex(x=>x.id===id):-1; return i<0?99:i; };
const statusOf = l => l.status||'new';
const isSent = l => statusOf(l)==='fired' || statusOf(l)==='done';
/* floor colour for a tab: grey all fulfilled · orange fired, waiting · blue waiting + held · red fulfilled + held */
function tabState(t){
  const ls=t.lines||[]; const held=ls.some(l=>statusOf(l)==='held'), waiting=ls.some(l=>statusOf(l)==='fired'), done=ls.some(l=>statusOf(l)==='done');
  if(held && waiting) return 'orange';
  if(held) return 'red';
  if(waiting) return 'blue';
  if(done) return 'grey';
  return '';
}
const STATE_TEXT = {grey:'All fulfilled', blue:'Fired, waiting on fulfilment', orange:'Waiting on fulfilment, items held', red:'Fired items fulfilled, items held'};
const hhmm = iso => new Date(iso).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
const unmetFor = l => effGroups(lprod(l.pid)).filter(a=>a.rule==='required' && !hasPick(l, a));
const seatSplit = l => { const n=(l.seats||[]).filter(x=>x!=='share').length; if(n<2) return null; const q=qtyOf(l); return q===1 ? 'shared' : q===n ? 'each' : 'uneven'; };
const seatText = l => { if(!(l.seats||[]).length) return ''; if(l.seats.includes('share')) return 'Shared · table';
  const base=(l.seats.length>1?'Seats ':'Seat ')+l.seats.slice().sort((a,b)=>a-b).join(', '), sp=seatSplit(l);
  return base + (sp==='shared' ? ' · shared' : sp==='each' ? ' · one each' : sp==='uneven' ? ` · ${qtyOf(l)} across ${l.seats.length} seats` : ''); };

const modsTotal = l => (l.mods||[]).reduce((a,m)=>a+(m.price||0),0);
const qtyOf = l => l.qty||1;
const lineTotal = l => { const g=(l.price + modsTotal(l)) * qtyOf(l) * partOf(l), a=adjApplied(l); return a ? g - adjOff(a,g) : g; };
function modsHtml(l){
  const mods=l.mods||[], need=unmetFor(l), st=seatText(l);
  if(!mods.length && !need.length && !st && !l.course) return '';
  const al=mods.filter(m=>m.alert), rest=mods.filter(m=>!m.alert);
  return `<div class="lmods">${st?`<span class="seatl">${st}</span>`:''}${l.course&&courseName(l.course)?`<span class="crs">${esc(courseName(l.course))}</span>`:''}${rest.map(m=>`<span>${esc(m.name)}${m.price?` +${money(m.price)}`:''}</span>`).join('')}${al.length?`<span class="al">Allergy: ${al.map(m=>esc(m.name)).join(', ')}</span>`:''}${need.length?`<span class="al">Needs: ${need.map(a=>esc(a.g.name)).join(', ')}</span>`:''}</div>`;
}

function scrollAppTop(){ const sc=$('#screen'), d=$('#device'); if(d && d.classList.contains('framed') && sc) sc.scrollTop=0; else window.scrollTo(0,0); const lp=$('#left'); if(lp) lp.scrollTop=0; }
function renderMods(el){
  const l=S.ticket[S.modLine], p=lprod(l.pid);
  if(S.modOpenFor!==l){ S.modOpenFor=l; requestAnimationFrame(scrollAppTop); }
  const eff=effGroups(p), effIds=new Set(eff.map(a=>a.gid));
  const others=S.live.mods.groups.filter(g=>!effIds.has(g.id));
  const need=unmetFor(l);
  const chips = (g) => `<div class="mchips">${g.items.map(m=>{ const on=(l.mods||[]).some(x=>x.id===g.id+':'+m.id);
      return `<button class="mchip ${g.alert?'al':''}" data-g="${g.id}" data-m="${m.id}" aria-pressed="${on}">${esc(m.name)}${m.price?` <span class="num">+${money(m.price)}</span>`:''}</button>`; }).join('')}</div>`;
  const badge = r => `<span class="rb ${r}">${ruleName(r)}</span>`;
  const tabNow = tabById(S.activeTab);
  const nSeats = Math.max(tabNow ? (tabNow.tables.length ? Math.max(stdOf(tabNow.tables), tabNow.guests) : tabNow.guests) : 4, ...(l.seats||[]).filter(x=>x!=='share'));
  const seatChips = () => `<div class="mchips seats"><button class="mchip share" data-seat="share" aria-pressed="${(l.seats||[]).includes('share')}">Share <span class="num">table</span></button>${Array.from({length:nSeats},(_,i)=>i+1).map(n=>`<button class="mchip" data-seat="${n}" aria-pressed="${(l.seats||[]).includes(n)}">Seat ${n}</button>`).join('')}</div>`;
  const ro = isSent(l);
  const courseChips = g => `<div class="mchips">${g.items.map(m=>`<button class="mchip" data-course="${m.id}" aria-pressed="${l.course===m.id}">${esc(m.name)}</button>`).join('')}</div>`;
  const body = g => g.kind==='seat' ? seatChips() : g.kind==='course' ? courseChips(g) : chips(g);
  const how = g => g.kind==='seat' ? 'Pick seats, or share with the table' : g.kind==='course' ? 'Pick one course' : (g.multi?'Pick any':'Pick one');
  const forced = eff.some(a=>a.rule!=='optional');
  el.innerHTML = `
    <div class="crumb mtop"><button id="mdone" ${need.length?'disabled':''}>${need.length?'Choose '+esc(need[0].g.name):(forced?'Done':'Done')}</button><b>Modifiers</b><span class="muted">${esc(p?p.name:'Item')} · ${esc(l.label)} · ${money(lineTotal(l))}</span></div>${checkMoveHtml(l)}
    ${ro?`<p class="note">Sent ${hhmm(l.firedAt)}${statusOf(l)==='done'?`, fulfilled ${hhmm(l.doneAt)}`:''}. Changes to a sent item go through a void.</p>`:''}
    ${eff.length ? eff.map(a=>`<div class="mgroup">
      <div class="mgh"><span class="lbl">${esc(a.g.name)}</span><span class="muted">${how(a.g)} ${badge(a.rule)}</span></div>
      ${body(a.g)}</div>`).join('') : '<p class="muted" style="font-size:13px">No modifier groups are assigned to this item or its menu.</p>'}
    ${others.length ? `<details class="mother"><summary>Other modifiers</summary>${others.map(g=>`<div class="mgroup"><div class="mgh"><span class="lbl">${esc(g.name)}</span><span class="muted">${how(g)}</span></div>${body(g)}</div>`).join('')}</details>` : ''}`;
  $('#mdone').onclick=()=>{ if(unmetFor(l).length) return; S.modOpenFor=null; S.modLine=null; renderLeft(); renderTicket(); };
  if(ro){ el.querySelectorAll('.mchip').forEach(b=>b.disabled=true); }
  el.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>{
    const v=b.dataset.course; l.course = l.course===v ? null : v;
    logEv('course_assign', {pid:l.pid, line:l.label, course:l.course?courseName(l.course):null});
    renderMods(el); renderTicket();
  });
  el.querySelectorAll('[data-seat]').forEach(b=>b.onclick=()=>{
    const v = b.dataset.seat==='share' ? 'share' : +b.dataset.seat;
    let seats = (l.seats||[]).slice();
    if(v==='share') seats = seats.includes('share') ? [] : ['share'];
    else { seats = seats.filter(x=>x!=='share'); seats = seats.includes(v) ? seats.filter(x=>x!==v) : [...seats, v]; }
    l.seats = seats;
    logEv('seat_assign', {pid:l.pid, line:l.label, seats:seats.slice()});
    renderMods(el); renderTicket();
  });
  el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    const g=S.live.mods.groups.find(x=>x.id===b.dataset.g), m=g.items.find(x=>x.id===b.dataset.m), key=g.id+':'+m.id;
    l.mods = l.mods || []; l.deplete = l.deplete || [];
    const had = l.mods.some(x=>x.id===key);
    const drop = x => { l.mods=l.mods.filter(y=>y.id!==x.id); l.deplete=l.deplete.filter(d=>d.mod!==x.id); };
    if(!g.multi) l.mods.filter(x=>x.gid===g.id && x.id!==key).forEach(x=>{ logEv('modifier_remove',{pid:l.pid, line:l.label, modifier:x.name, group:g.name, replacedBy:m.name}); drop(x); });
    if(had) drop({id:key});
    else {
      l.mods.push({id:key, gid:g.id, name:m.name, price:m.price||0, alert:!!g.alert});
      if(m.link && m.link.pid) l.deplete.push({pid:m.link.pid, ml:m.link.ml, mod:key});
    }
    logEv(had?'modifier_remove':'modifier_add', {pid:l.pid, line:l.label, modifier:m.name, group:g.name});
    renderMods(el); renderTicket();
  });
}

/* per-item setup inside a product or menu-item form */
function modSectionHtml(){ return `<div class="fs"><h3>Modifiers</h3><div id="pmods"></div></div>`; }
function renderItemMods(p){
  const el=$('#pmods'); if(!el) return;
  const work={settings:S.settings, mods:S.mods};
  const own=S.mods.items[p.id], useOwn = own && own.inherit===false;
  const inherited = (()=>{ const tmp=S.mods.items[p.id]; delete S.mods.items[p.id]; const r=effGroups(p, work); if(tmp) S.mods.items[p.id]=tmp; return r; })();
  const ruleOpts = sel => RULES.map(([k,l])=>`<option value="${k}" ${sel===k?'selected':''}>${l}</option>`).join('');
  el.innerHTML = `<div class="seg" role="group" aria-label="Modifier source"><button type="button" data-src="inherit" aria-pressed="${!useOwn}">Inherit from menus</button><button type="button" data-src="own" aria-pressed="${!!useOwn}">Its own modifiers</button></div>
    ${!useOwn
      ? (inherited.length ? `<ul class="inh">${inherited.map(a=>`<li><b>${esc(a.g.name)}</b> <span class="rb ${a.rule}">${ruleName(a.rule)}</span> <span class="muted">from ${esc(a.from)}</span></li>`).join('')}</ul>` : '<p class="muted" style="font-size:13px;margin:0">None of this item’s menus carry a modifier group.</p>')
      : `<div class="scroll"><table class="tbl" id="own-mods" style="min-width:420px"><thead><tr><th>Group</th><th>Rule</th><th></th></tr></thead><tbody>
          ${own.groups.map((a,i)=>`<tr data-r="${i}"><td><select data-f="gid">${S.mods.groups.map(g=>`<option value="${g.id}" ${a.gid===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></td><td><select data-f="rule">${ruleOpts(a.rule)}</select></td><td><button class="x" data-rm="${i}" aria-label="Remove group">×</button></td></tr>`).join('')}
        </tbody></table></div><div><button class="btn" id="own-add">+ Add group</button></div>`}
    <div><button class="btn" id="own-new">+ New modifier group for this item</button><span class="h" style="display:block;margin-top:4px">Starts tied to this item only. You can assign it to menus later.</span></div>`;
  $('#own-new').onclick=()=>{
    const id='g'+Date.now();
    S.mods.groups.push({id, name:p.name+' options', multi:true, items:[{id:id+'-0', name:'New modifier', price:0, link:null}]});
    if(!useOwn) S.mods.items[p.id] = {inherit:false, groups:inherited.map(a=>({gid:a.gid, rule:a.rule}))};
    S.mods.items[p.id].groups.push({gid:id, rule:'optional'});
    save(); S.modSel=id; S.modReturn=p.id; S.libTab='mods'; renderLibrary();
  };
  el.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{
    if(b.dataset.src==='own' && !useOwn) S.mods.items[p.id] = {inherit:false, groups:inherited.map(a=>({gid:a.gid, rule:a.rule}))};
    if(b.dataset.src==='inherit') delete S.mods.items[p.id];
    save(); renderItemMods(p);
  });
  if(useOwn){
    $('#own-mods').addEventListener('change',e=>{ const tr=e.target.closest('tr[data-r]'); const a=own.groups[+tr.dataset.r]; a[e.target.dataset.f]=e.target.value; save(); });
    el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ own.groups.splice(+b.dataset.rm,1); save(); renderItemMods(p); });
    $('#own-add').onclick=()=>{ const g=S.mods.groups.find(g=>!own.groups.some(a=>a.gid===g.id)) || S.mods.groups[0]; if(g){ own.groups.push({gid:g.id, rule:'optional'}); save(); renderItemMods(p); } };
  }
}

function renderItemQuickEdit(m, q, p){
  const cost=itemCost(p);
  m.innerHTML = `<div class="modalbg" id="qe-bg"><div class="modal qe" role="dialog" aria-modal="true" aria-labelledby="qe-title">

    if(q.price!=null && q.price>0 && q.price!==p.price){
      changes.push({field:'price', from:p.price, to:q.price});
      [p, ...[S.products, S.saved.products].map(l=>l.find(x=>x.id===p.id)).filter(Boolean)].forEach(c=>{ c.price=q.price; c.placeholder=false; });
    }
    const prevAv=S.availOv[p.id]==='86'?'86':'auto';
    if(q.avail!==prevAv){ changes.push({field:'availability', from:prevAv, to:q.avail}); if(q.avail==='86') S.availOv[p.id]='86'; else delete S.availOv[p.id]; saveAvail(); }
    store.set('live', S.live); store.set('draft', S.saved);

function saveQuickEdit(){
  const q=S.qe, p=lprod(q.pid), changes=[];
  if(q.count!=null && Math.abs(q.count-invOf(p.id))>1e-9){ changes.push({field:'count', from:+invOf(p.id).toFixed(3), to:q.count}); S.inv[p.id]=q.count; saveInv(); }
  const prevAv=S.availOv[p.id]||'auto';
  if(q.avail!==prevAv){ changes.push({field:'availability', from:prevAv, to:q.avail}); if(q.avail==='auto') delete S.availOv[p.id]; else S.availOv[p.id]=q.avail; saveAvail(); }
  /* the same edit lands in the published library, the saved draft and the editor, so the next publish keeps it */
  const copies=[p, ...[S.products, S.saved.products].map(list=>list.find(x=>x.id===p.id)).filter(Boolean)];
  ['frontline','net','sale'].forEach(k=>{ if((q.cost[k]??null)!==(p.cost[k]??null)){ changes.push({field:k+' cost', from:p.cost[k]??null, to:q.cost[k]??null}); copies.forEach(c=>{ c.cost[k]=q.cost[k]; }); } });
  p.servings.forEach((s,i)=>{
    const before=stdPrice(p,s).price, after=q.prices[i];
    if(after!=null && after>0 && after!==before){
      changes.push({field:'price', pour:servLabel(s), from:before, to:after});
      copies.forEach(c=>{ const cs=c.servings[i]; if(cs && servLabel(cs)===servLabel(s)) cs.override=after; });
    }
  });
  store.set('live', S.live); store.set('draft', S.saved);
  if(changes.length) logEv('quick_edit', {flagged:true, pid:p.id, product:p.name, changes});
}

    </section>

  </div><div id="modal"></div>`;
  $('#fm-col').onclick=()=>{ S.floorCollapsed=!col; store.set('floorCollapsed', S.floorCollapsed); if(S.floorCollapsed){ S.fmode=null; S.editT=null; } renderFloor(); };
  if(!col){
    $('#fm-svc').onclick=()=>{ S.fmode=null; S.editT=null; renderFloor(); };
    $('#fm-edit').onclick=()=>{ S.fmode='edit'; S.join=null; renderFloor(); };
  }
  renderFloorStat(); renderFloorMap(); renderJoinBar(); renderFloorSide(); renderGuestPrompt();
  if(!col) requestAnimationFrame(renderFloorMap);
}
function renderFloorStat(){
  const el=$('#fstat'); if(!el) return;
  const seated=S.tabs.reduce((a,t)=>a+(t.tables.length?t.guests:0),0), seats=stdOf(S.floor.tables.map(t=>t.id));
  const used=S.floor.tables.filter(t=>tableTab(t.id)).length;
  el.textContent = `${seated} guest${seated===1?'':'s'} seated · ${used} of ${S.floor.tables.length} tables in use · ${seats} seats in the standard layout`;
}

function renderFloorMap(){
  const el=$('#floor'); if(!el) return;
  renderFloorStat();
  const active = tabById(S.activeTab);
  const port = floorPortrait();
  const VW = port?FLOOR_H:FLOOR_W, VH = port?FLOOR_W:FLOOR_H;
  /* portrait: the room turns 90° clockwise so it fits a tall screen; labels stay upright */
  const P = o => port ? {x:FLOOR_H-o.y-o.h, y:o.x, w:o.h, h:o.w} : o;
  const box = o => { const q=P(o); return `left:${pc(q.x,VW)};top:${pc(q.y,VH)};width:${pc(q.w,VW)};height:${pc(q.h,VH)}`; };
  el.classList.toggle('portrait', port);
  el.style.aspectRatio = `${VW} / ${VH}`;
  el.style.setProperty('--sh', screenH()+'px');
  const pxPer = (el.clientWidth||VW)/VW;
  el.innerHTML =
    FIXTURES.map(f=>`<i class="fx" style="${box(f)}"></i>`).join('') +
    FLABELS.map(f=>`<span class="flabel ${port?'vert':''}" style="${box(f)}">${esc(f.text)}</span>`).join('') +
    S.floor.tables.map(t=>{
      const tab=tableTab(t.id), cls=['tnode',t.shape];
      let sub = t.shape==='rect' ? `${rangeText(t)} guests` : '';
      if(tab){ cls.push('occ'); const st=tabState(tab); if(st) cls.push('st-'+st); if(t.shape==='rect') sub = tabMain(tab)===t.id ? `${tab.guests}g · ${cash(tabTotal(tab))}` : `with ${esc(tlabel(tabMain(tab)))}`; }
      if(S.join){ if(S.join.sel.includes(t.id)) cls.push('jsel'); else if(tab) cls.push('dis'); }
      if(S.fmode==='edit' && S.editT===t.id) cls.push('esel');
      if(S.move){ const mt=tabById(S.move.tabId); if(mt&&mt.tables.includes(t.id)) cls.push('jsel'); }
      if(!S.join && S.fmode!=='edit' && active && active.tables.includes(t.id)) cls.push('cur');
      const aria = `${t.label}, ${t.area}, seats ${rangeText(t)}, layout ${t.std}${tab?`, open tab, ${tab.guests} guests${tabState(tab)?', '+STATE_TEXT[tabState(tab)]:''}`:''}`;
      if(sub && P(t).w*pxPer < 56) sub='';
      return `<button class="${cls.join(' ')}" data-t="${esc(t.id)}" aria-label="${esc(aria)}" style="${box(t)}"><span>${esc(t.label)}</span>${sub?`<small>${sub}</small>`:''}</button>`;
    }).join('');
  el.querySelectorAll('[data-t]').forEach(b=>{ b.onclick=()=>tableClick(b.dataset.t); if(S.fmode!=='edit' && !S.join && !S.move) longPress(b, ()=>{ const tb=tableTab(b.dataset.t); if(tb) startMove(tb.id,'floor'); }); });
}

function tableClick(id){
  const tab=tableTab(id);
  if(S.fmode==='edit'){ S.editT=id; S.addingArea=false; renderFloorMap(); renderFloorSide(); return; }
  if(S.move) return moveTo(id);
  if(S.join){
    if(id===S.join.anchor || tab) return;
    const i=S.join.sel.indexOf(id); if(i>=0) S.join.sel.splice(i,1); else S.join.sel.push(id);
    S.join.confirm=false; renderFloorMap(); renderJoinBar(); return;
  }
  if(tab){ S.activeTab=tab.id; S.editTab=false; S.modLine=null; S.sel=null; S.custom=false; S.view='register'; render(); return; }
  S.guestPrompt={tableId:id, n:null}; renderGuestPrompt();
}

function openTab(tables, guests, extra={}){
  const main=lowestTable(tables);
  const t={id:'t'+Date.now(), no:++S.tabSeq, server:S.user, tables:sortTables(tables), table:main||null, guests, area:main?((tableById(main)||{}).area||''):(extra.area||'No table'),
    name:(extra.name||'').trim(), notes:(extra.notes||'').trim(), allergies:(extra.allergies||[]).slice(), lines:[]};
  S.editTab=false;
  S.tabs.push(t); S.activeTab=t.id; logEv('open_tab',{tables:t.tables, table:t.table, guests, area:t.area, name:t.name||null, hasNotes:!!t.notes, allergies:t.allergies.length}); S.join=null; S.sel=null; S.custom=false; S.view='register'; render();
}

function renderGuestPrompt(){
  const m=$('#modal'); if(!m) return;
  const g=S.guestPrompt; if(!g){ m.innerHTML=''; return; }
  const t=g.tableId?tableById(g.tableId):null, max=t?t.max:Infinity;
  m.innerHTML = `<div class="modalbg" id="gp-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="gp-title">
    <div><h2 id="gp-title" class="ftitle">${t?esc(tabTitle({tables:[t.id]})):'New tab'}</h2><span class="muted">${t?`${esc(t.area)} · seats ${rangeText(t)} · layout ${t.std}`:'Not on a table'}</span></div>
    ${t?'':`<div class="lbl">Dining area</div><div class="gquick garea">${[...S.floor.areas,'Standing room'].map(a=>`<button type="button" data-ga="${esc(a)}" aria-pressed="${g.area===a}">${esc(a)}</button>`).join('')}</div>`}
    <label class="lbl" for="gp-n">${t?'How many guests?':'Guests <span class="opt">optional</span>'}</label>
    <div class="gcount"><button type="button" id="gp-minus" aria-label="One fewer">−</button><input id="gp-n" type="number" min="1" max="99" inputmode="numeric" value="${g.n??''}" placeholder="0"><button type="button" id="gp-plus" aria-label="One more">+</button></div>
    <div class="gquick">${[1,2,3,4,5,6,7,8].map(k=>`<button type="button" data-g="${k}" aria-pressed="${g.n===k}">${k}</button>`).join('')}</div>
    <p class="note" id="gp-note"></p>
    <label class="f"><span class="lbl">Tab name <span class="opt">optional</span></span><input id="gp-name" maxlength="40" autocomplete="off" placeholder="e.g. Jeff" value="${esc(g.name||'')}"></label>
    <label class="f"><span class="lbl">Notes <span class="opt">optional</span></span><textarea id="gp-notes" rows="2" maxlength="300" placeholder="Allergies, occasions, preferences">${esc(g.notes||'')}</textarea></label>
    ${allergyEditHtml(g.allergies,'gp')}
    <div class="row-btns"><button class="btn" id="gp-cancel">Cancel</button><button class="btn" id="gp-seat" hidden>Seat anyway</button><button class="btn pri" id="gp-ok"></button></div>
  </div></div>`;
  const inp=$('#gp-n');
  const upd=()=>{
    const n=g.n;
    $('#gp-ok').disabled = t ? !(n>0) : !g.area;
    m.querySelectorAll('[data-ga]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.ga===g.area)));
    $('#gp-ok').textContent = n>max ? 'Choose more tables' : 'Open tab';
    $('#gp-seat').hidden = !(n>max);
    $('#gp-note').textContent = n>max ? `${tabTitle({tables:[t.id]})} seats up to ${t.max}. Seat the party of ${n} here anyway, or choose the other tables they'll use.`
      : (t && n && n<t.min) ? `${tabTitle({tables:[t.id]})} is set for ${rangeText(t)} guests. A party of ${n} is below that. You can still open the tab.` : '';
    m.querySelectorAll('[data-g]').forEach(b=>b.setAttribute('aria-pressed', String(+b.dataset.g===n)));
  };
  const setN=n=>{ g.n = (n>0) ? Math.min(99,Math.round(n)) : null; inp.value = g.n??''; upd(); };
  inp.addEventListener('input',()=>{ const n=parseInt(inp.value,10); g.n = n>0 ? Math.min(99,n) : null; upd(); });
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); ok(); } });
  $('#gp-name').addEventListener('input',e=>{ g.name=e.target.value; });
  $('#gp-name').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); ok(); } });
  $('#gp-notes').addEventListener('input',e=>{ g.notes=e.target.value; });
  $('#gpaladd').onclick=()=>openAllergyAdd(g.n||(t?t.std:1), e=>{ g.allergies=[...(g.allergies||[]), e]; renderGuestPrompt(); });
  m.querySelectorAll('[data-gpalx]').forEach(b=>b.onclick=()=>{ g.allergies.splice(+b.dataset.gpalx,1); renderGuestPrompt(); });
  m.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>setN(+b.dataset.g));
  m.querySelectorAll('[data-ga]').forEach(b=>b.onclick=()=>{ g.area=b.dataset.ga; upd(); });
  $('#gp-minus').onclick=()=>setN((g.n||1)-1);
  $('#gp-plus').onclick=()=>setN((g.n||0)+1);
  const close=()=>{ S.guestPrompt=null; renderGuestPrompt(); };
  $('#gp-cancel').onclick=close;
  $('#gp-bg').addEventListener('click',e=>{ if(e.target.id==='gp-bg') close(); });
  m.querySelector('.modal').addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
  function ok(){
    const n=g.n || (t?0:1); if(!(n>0)) return; if(!t && !g.area){ $('#gp-note').textContent='Pick a dining area, or Standing room.'; return; }
    S.guestPrompt=null; renderGuestPrompt();

    else if(n<=max) openTab([t.id], n, g);
    else { S.join={anchor:t.id, guests:n, sel:[t.id], confirm:false, name:g.name, notes:g.notes, allergies:(g.allergies||[]).slice()}; renderFloorMap(); renderJoinBar(); renderFloorSide(); }
  }
  $('#gp-ok').onclick=ok;
  $('#gp-seat').onclick=()=>{ const n=g.n; if(!(n>0)) return; S.guestPrompt=null; renderGuestPrompt(); openTab([t.id], n, g); };

function renderJoinBar(){

function renderFloorSide(){
  const el=$('#fside'); if(!el) return;
  if(S.fmode==='edit') return renderTableEditor(el);
  const sf=S.serverFilter||'all';
  const mineOK = t => sf==='all' ? true : sf==='mine' ? t.server===S.user : t.server===sf;
  const vis=S.tabs.filter(mineOK);
  const onTables=vis.filter(t=>t.tables.length), loose=vis.filter(t=>!t.tables.length);
  const quick = S.quick.length ? [{quick:true}] : [];
  const f=S.tabFilter||'all';
  const sort = S.tabSort[f] || (f==='tabs'?'recent':'number');
  const modOf = t => t.quick ? (S.quickMod||'') : (t.modified||'');
  const byRecent = (a,b) => modOf(b).localeCompare(modOf(a));
  const byNumber = (a,b) => { const ka=/^B/.test(tabMain(a))?1:0, kb=/^B/.test(tabMain(b))?1:0; return ka-kb || tnum(tabMain(a))-tnum(tabMain(b)); };
  const order = list => sort==='recent' ? list.slice().sort(byRecent) : sort==='oldest' ? list.slice().sort((a,b)=>-byRecent(a,b)) : list;
  const items = f==='tables' ? (sort==='number' ? onTables.slice().sort(byNumber) : order(onTables))
              : f==='tabs' ? order([...loose, ...quick])
              : (sort==='number' ? [...onTables.slice().sort(byNumber), ...[...loose, ...quick].sort(byRecent)] : order([...onTables, ...loose, ...quick]));
  const sortOpts = f==='tabs' ? [['recent','Most recent'],['oldest','Least recent']] : [['number','Number'],['recent','Most recent'],['oldest','Least recent']];
  const ago = iso => { if(!iso) return ''; const m=Math.max(0,Math.round((Date.now()-new Date(iso))/60000)); return m<1?'just now':m<60?m+'m ago':Math.floor(m/60)+'h '+(m%60)+'m ago'; };
  const counts = {all:onTables.length+loose.length+quick.length, tables:onTables.length, tabs:loose.length+quick.length};
  const row = t => {
    if(t.quick){ const tot=S.quick.reduce((a,l)=>a+lineTotal(l),0);
      return `<li><button data-quick aria-current="${S.activeTab===null}"><span class="tn">Quick ticket</span><span class="tm">No table · ${S.quick.length} item${S.quick.length===1?'':'s'}${S.quickMod?' · '+ago(S.quickMod):''}</span><span class="tp num">${cash(tot)}</span></button></li>`; }
    const where = t.tables.length ? `${t.tables.length>1?esc(tabJoined(t))+' · ':''}${t.guests} guest${t.guests===1?'':'s'} · ${esc(t.area)}${seatsOf(t.tables)<t.guests?' · <span class="warnbox">short on seats</span>':''}`
                                  : `${esc(t.area||"No table")} · ${t.guests} guest${t.guests===1?'':'s'}`;
    return `<li><button data-tab="${t.id}" aria-current="${t.id===S.activeTab}"><span class="tn">${tabState(t)?`<i class="sdot st-${tabState(t)}" title="${STATE_TEXT[tabState(t)]}"></i>`:''}${esc(tabHeading(t))}</span><span class="tm"><span class="srv">${esc(staffName(t.server))}</span> · ${where}${t.notes?` · <span class="nflag" title="${esc(t.notes)}">Note</span>`:''}${t.modified?' · '+ago(t.modified):''}</span><span class="tp num">${cash(tabTotal(t))}</span></button></li>`;
  };
  const empty = sf!=='all' && !vis.length ? (sf==='mine' ? 'You have no open tickets.' : `${staffName(sf)} has no open tickets.`) : {all:'Tap a table to seat a party, or open a tab without one.', tables:'No tables seated right now.', tabs:'No open tabs without a table.'}[f];
  el.innerHTML = `<div class="ph"><h2>Open</h2>
      <div class="seg" role="group" aria-label="Show">${[['all','All'],['tables','Tables'],['tabs','Tabs']].map(([k,l])=>`<button data-tf="${k}" aria-pressed="${f===k}">${l} <span class="cc">${counts[k]}</span></button>`).join('')}</div></div>
    <div class="tsort"><span class="lbl">Server</span><div class="seg" role="group" aria-label="Server">${[['mine','My tickets'],['all','All tickets']].map(([k,l])=>`<button data-sf="${k}" aria-pressed="${sf===k}">${l}</button>`).join('')}</div>
      <select id="sf-pick" aria-label="Clocked-in server"><option value="">Clocked in…</option>${S.clock.map(pin=>`<option value="${pin}" ${sf===pin?'selected':''}>${esc(staffName(pin))} (${S.tabs.filter(t=>t.server===pin).length})</option>`).join('')}</select></div>
    <div class="tsort"><span class="lbl">Order</span><div class="seg" role="group" aria-label="Order">${sortOpts.map(([k,l])=>`<button data-ts="${k}" aria-pressed="${sort===k}">${l}</button>`).join('')}</div></div>
    ${items.length ? `<ul class="tabs">${items.map(row).join('')}</ul>` : `<p class="empty">${empty}</p>`}
    <div class="row-btns"><button class="btn" id="newtab">+ New tab</button><button class="btn" id="quick">Quick ticket</button></div>`;
  el.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>{ S.tabFilter=b.dataset.tf; store.set('tabFilter', S.tabFilter); renderFloorSide(); });
  el.querySelectorAll('[data-sf]').forEach(b=>b.onclick=()=>{ S.serverFilter=b.dataset.sf; store.set('serverFilter',S.serverFilter); renderFloorSide(); });
  $('#sf-pick').addEventListener('change',e=>{ if(!e.target.value) return; S.serverFilter=e.target.value; store.set('serverFilter',S.serverFilter); renderFloorSide(); });
  el.querySelectorAll('[data-ts]').forEach(b=>b.onclick=()=>{ S.tabSort[f]=b.dataset.ts; store.set('tabSort', S.tabSort); renderFloorSide(); });
  el.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ S.activeTab=b.dataset.tab; S.editTab=false; S.modLine=null; S.sel=null; S.custom=false; S.view='register'; render(); });
  const goQuick=()=>{ S.activeTab=null; S.modLine=null; S.view='register'; render(); };
  el.querySelectorAll('[data-quick]').forEach(b=>b.onclick=goQuick);
  $('#quick').onclick=goQuick;
  $('#newtab').onclick=()=>{ S.guestPrompt={tableId:null, n:null}; renderGuestPrompt(); };
}

function floorPortrait(){
  const m=(S.dev||{}).mode;
  if(m==='phone') return true;
  if(m==='ipad') return !S.dev.ipadLand;
  return window.innerHeight > window.innerWidth;
}
function screenH(){
  const m=(S.dev||{}).mode;
  if(m==='phone') return 800;
  if(m==='ipad') return S.dev.ipadLand ? 820 : 1180;
  return window.innerHeight;
}

function applyDevice(){

  document.querySelectorAll('[data-dev]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.dev===mode)));
  $('#d-rot').hidden = mode!=='ipad';
  if(mode==='full'){ d.style.setProperty('--apph', window.innerHeight+'px'); d.className='device'; d.style.width=d.style.height=''; fit.style.width=fit.style.height=''; $('#d-meta').textContent=''; if(S.view==='floor') requestAnimationFrame(renderFloorMap); return; }
  let {w,h,label}=DEVICES[mode];
  if(mode==='ipad' && S.dev.ipadLand){ [w,h]=[h,w]; label='iPad Air 11″ · 1180 × 820 pt landscape'; }
  else if(mode==='ipad') label='iPad Air 11″ · 820 × 1180 pt portrait';
  const outer = 20; /* frame border on both sides */
  const avail = Math.max(200, document.documentElement.clientWidth - 32);
  const k = Math.min(1, avail/(w+outer));
  d.className='device framed'; d.style.width=(w+outer)+'px'; d.style.height=(h+outer)+'px'; d.style.setProperty('--k', k); d.style.setProperty('--apph', h+'px');
  fit.style.width=((w+outer)*k)+'px'; fit.style.height=((h+outer)*k)+'px';
  $('#d-meta').textContent = label + (k<1 ? ` · shown at ${Math.round(k*100)}%` : '');
  if(S.view==='floor') requestAnimationFrame(renderFloorMap);
}
document.querySelectorAll('[data-dev]').forEach(b=>b.onclick=()=>{ S.dev.mode=b.dataset.dev; store.set('dev',S.dev); applyDevice(); });
$('#d-rot').onclick=()=>{ S.dev.ipadLand=!S.dev.ipadLand; store.set('dev',S.dev); applyDevice(); };
